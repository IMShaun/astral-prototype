# Index only. Do not invent patterns. Fill from inspected product evidence via /ux-patterns.
version: 1
patterns:
  - id: foundation.native-overflow
    name: Native overflow
    level: foundation
    user_goal: Reach content that does not fit the view without losing keyboard or platform scroll behaviour
    objects: [pane, stage, table, tree, modal, reports]
    actions: [scroll, contain, wrap]
    used_in: [Portfolio, Reports, Settings, Users, Alerts, Queries, Compare, Sign in]
    entry_points:
      - Overflow on a named owner
    structure: One CSS overflow owner â†’ native bar â†’ keyboard reach if no tab stop
    components: [pane-body, stage-body, table-wrap, modal-body, tabs]
    states: [fits, overflows, nested, reduced-motion]
    permissions: all
    content_terms: []
    variants:
      - Tabs hide the bar inside the pill
    exceptions:
      - Tabs. Tab buttons are the keyboard path. Do not put a track in the pill.
    accessibility: WCAG 2.1.1 keyboard on the region or a descendant. Thumb versus track at least 3:1. Focus is a 2px black edge.
    implementation_refs:
      - styles.css
      - prototype.js protoBindScrollRegions
      - .cursor/skills/ux-patterns/references/scrollbars.md
    evidence:
      - Named desk rule: native scroll, Tabs hide the bar, Breakdown draws every row at once, Reports wrap
    maturity: emerging
    health: healthy
    last_reviewed: "2026-09-18"
    decision_refs:
      - UXDR-2026-09-18-native-overflow
  - id: foundation.card-stack
    name: Card stack
    level: foundation
    user_goal: Scan sibling cards without them touching or using a one-off margin
    objects: [card, board-block, list]
    actions: [scan, compare]
    used_in: [Today, Skills, Patterns, UI library, Access, User groups]
    entry_points:
      - Any list or detail that paints more than one card
    structure: Named stack with gap 16px â†’ cards â†’ labelled blocks inside a board-block use the same gap
    components: [card, board-block]
    states: [stack, fold-closed, fold-open]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - Desk folds. Head and clip sit flush. The grid lives in the open clip.
      - Table rows and notes lists use a 1px line.
      - Compact title-and-line cards keep 8px inside.
    accessibility: Gap is layout. Focus is a 2px black edge.
    implementation_refs:
      - styles.css
      - .cursor/skills/ux-patterns/references/spacing.md
    evidence:
      - Named desk rule: 16px card stacks. Skills detail had labelled blocks with no gap.
    maturity: emerging
    health: healthy
    last_reviewed: "2026-09-18"
    decision_refs:
      - UXDR-2026-09-18-card-stack
  - id: foundation.library-check
    name: Library check
    level: foundation
    user_goal: Keep painted UI on the named Astral pieces and catch a duplicate before it spreads
    objects: [component, token, builder]
    actions: [inventory, compare, flag]
    used_in: [Prototype, Skills, UI library, desk chrome]
    entry_points:
      - After painting a control
      - A suspected duplicate of Button, Tag, or Back
    structure: Named library â†’ live builders â†’ scan prototype and desk â†’ suggest â†’ wait for Yes
    components: [button, tag, icon-button, count]
    states: [match, drift, named-exception]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - Desk .status pills until status colour ships
      - Figma extract waits
      - Storybook and visual CI wait
    accessibility: The check does not replace axe. Focus is a 2px black edge.
    implementation_refs:
      - astral-ui.js
      - data/design-systems.json
      - .cursor/skills/ux-patterns/scripts/check-library.mjs
      - .cursor/skills/ux-patterns/references/library-check.md
    evidence:
      - Methods brief. Skills Back used an Icon button scale. Card stacks had no gap.
    maturity: emerging
    health: healthy
    last_reviewed: "2026-09-18"
    decision_refs:
      - UXDR-2026-09-18-library-check
  - id: foundation.section-box
    name: Section box
    level: foundation
    user_goal: See where one labelled set of options ends and the next begins inside a card
    objects: [card, section, setting-row]
    actions: [scan, group]
    used_in: [Settings]
    entry_points:
      - A card or pane with two or more labelled sets of rows
    structure: Section, heading above, then a bordered box of rows
    components: [astral-setting-group, astral-setting-head, astral-setting-rows]
    states: [default]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - One set of rows with no heading needs no box
    accessibility: Section is labelled by its heading via aria-labelledby. Focus is a 2px black edge.
    implementation_refs:
      - styles.css .astral-setting-group
      - prototype.js protoNotificationsCard
    evidence:
      - User corrections on 2026-10-06. Corners match cards (16px). Heading sits outside and above the box.
    maturity: emerging
    health: healthy
    last_reviewed: "2026-10-06"
    decision_refs: []
  - id: foundation.table-in-fold
    name: Table in a fold
    level: foundation
    user_goal: Read a fold's table without a gap above the headers or a doubled line below the last row
    objects: [fold, accordion, table]
    actions: [scan, expand]
    used_in: [Users]
    entry_points:
      - A fold whose body is a table and whose row draws its own bottom rule
    structure: Fold head, then the table with no top padding, last row without a border, then the fold's rule
    components: [astral-people-fold, astral-people, astral-table]
    states: [open, closed, nested]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - A table boxed in .astral-fold-panel is closed by the panel
      - A fold with a top rule only, such as Breakdown, keeps the last row's line
    accessibility: No change to table semantics. Focus is a 2px black edge.
    implementation_refs:
      - styles.css .astral-people-fold .astral-people
      - prototype.js protoUsersTable
    evidence:
      - User correction on 2026-10-16. Uneven padding and a doubled bottom line in the people folds (commit 3482c0a).
    maturity: emerging
    health: healthy
    last_reviewed: "2026-10-16"
    decision_refs: []
  - id: foundation.frozen-panes
    name: Frozen panes
    level: foundation
    user_goal: Read a value deep in a long or wide readings table and still see its time and column
    objects: [table, readings]
    actions: [scan, scroll, page]
    used_in: [Portfolio, Meter view]
    entry_points:
      - A table with one row per time step and one column per meter, channel or series
    structure: Key and column paging, then a capped scroll box with sticky column headers and a sticky Time column
    components: [astral-breakdown-scroll, astral-breakdown-cols, astral-breakdown-bar]
    states: [fits, wide, scrolled]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - Short lists with a few fixed columns grow with the page
    accessibility: The scroll box is a focusable labelled region. The column range is a polite live region.
    implementation_refs:
      - styles.css .astral-breakdown-scroll
      - prototype.js protoBreakdownPanel
      - prototype.js protoMeterReadingsCard
    evidence:
      - User correction on 2026-10-16. The meter view readings needed sticky headers and sideways scrolling, on every table like it (commit 40211d2).
    maturity: emerging
    health: healthy
    last_reviewed: "2026-10-16"
    decision_refs: []
  - id: foundation.type-tags
    name: Type tags
    level: foundation
    user_goal: Tell types apart at a glance and read the type label easily
    objects: [tag, type-mark]
    actions: [scan]
    used_in: [Alerts, Reports, Downloads, Inbox, Queries]
    entry_points:
      - A tag built with a type mark, such as Threshold alert, Data extract, Data export, or Fixed
    structure: Tag filled with the mark's light colour, icon and text in its dark colour. Mixed groups (all cards, Resolved as) use the neutral palette.
    components: [astral-tag, astral-type-badge]
    states: [default]
    permissions: all
    content_terms: [Threshold alert, Missing data]
    variants: [threshold, missing-data, no-signal, all, open, resolved, extract, dcda, billing, template, download-report, download-export, download-document, fixed, expected, duplicate]
    exceptions:
      - Status tags such as Weekly or Coming soon are not types and have no mark
      - Filter pills keep a neutral fill with a coloured icon
    accessibility: Label names the type, so colour is not the only signal. Text contrast is at least 4.5:1.
    implementation_refs:
      - styles.css .astral-tag.has-mark
      - styles.css .astral-type-badge[data-mark]
      - astral-ui.js protoTag
      - astral-ui.js PROTO_MARK_ICONS
    evidence:
      - User correction on 2026-10-06. Tag fill is the mark's light colour, text and icon its dark colour.
      - User correction on 2026-10-06. Alerts changes must reach every page. Grey icons on Reports were not wanted (commit ff78c87).
    maturity: emerging
    health: healthy
    last_reviewed: "2026-10-06"
    decision_refs: []
  - id: foundation.summary-cards
    name: Summary cards
    level: foundation
    user_goal: See how many of each kind there are and filter to one kind with a click
    objects: [stat-card, type-mark]
    actions: [scan, filter]
    used_in: [Alerts, Reports, Downloads]
    entry_points:
      - The count cards under the page tabs
    structure: Badge and name on top, count below. Every card has a badge, coloured for one type, grey for a mixed group. Selection shows on the container. Cards work like tabs, with no pill or Filter menu group.
    components: [astral-summary-stat, astral-summary-name, astral-type-badge]
    states: [default, selected, disabled]
    permissions: all
    content_terms: [Open flags, Resolved flags]
    variants: []
    exceptions:
      - Work Desk stat strips are not yet checked
    accessibility: Buttons with aria-pressed. Name gives the type, so colour is not the only signal.
    implementation_refs:
      - prototype.js protoSummaryCards
      - styles.css .astral-summary-stat
    evidence:
      - User question on 2026-10-06. The card felt off with the badge under the count (commit 6e29f8f).
      - User correction on 2026-10-06. Grey icons on Reports were not wanted (commit ff78c87).
    maturity: emerging
    health: healthy
    last_reviewed: "2026-10-06"
    decision_refs: []
  - id: foundation.heading-spacing
    name: Heading spacing
    level: foundation
    user_goal: See which heading owns which content and which heading is the top level
    objects: [pane, card, section, heading]
    actions: [scan]
    used_in: [Settings]
    entry_points:
      - Any heading over content with its own internal gaps
    structure: Gap under a heading matches the largest gap inside its content. Control bars keep 16px.
    components: [astral-pane-head, astral-setting-head, astral-people-tools]
    states: [heading-only, with-control-bar]
    permissions: all
    content_terms: []
    variants:
      - Heading only gets 24px on Settings
      - Head with a control bar keeps 16px
    exceptions:
      - Desk folds sit flush
      - Control bars stay 16px from the content they act on, measured from the bar
    accessibility: Spacing supports, but does not replace, real heading levels.
    implementation_refs:
      - styles.css .astral-settings-main .astral-pane-head
      - styles.css .astral-setting-group
    evidence:
      - User correction on 2026-10-06. Settings pane heading went from 16px to 32px above 24px-spaced sections.
      - User correction on 2026-10-06. 32px was too big, now 24px. Control bar heads keep 16px.
    maturity: emerging
    health: needs-evidence
    last_reviewed: "2026-10-06"
    decision_refs: []
  - id: foundation.stable-controls
    name: Stable controls
    level: foundation
    user_goal: Click through tabs or options without the control moving away from the pointer
    objects: [tabs, segmented-control, tree, stat-card, pagination, select, choice-card, period-table]
    actions: [switch, select, filter]
    used_in: [Alerts, Reports, Downloads, Site settings]
    entry_points:
      - Any control clicked repeatedly to switch between items
    structure: Reserve the size of anything above the control so every state puts it in the same place
    components: [astral-page-tools, astral-page-actions, astral-tabs, astral-meter-src-cards, astral-period-table]
    states: [each-tab, with-action, without-action, loading, read-only, editable]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - Movement the person asks for, such as scrolling, resizing, or opening a panel
    accessibility: WCAG 3.2.3 Consistent navigation. Helps magnification, tremor, and switch access users.
    implementation_refs:
      - styles.css .astral-page-tools min-height
      - styles.css .astral-summary-stat --summary-mark
      - prototype.js protoReportsAreaHead
    evidence:
      - User correction on 2026-10-06. Alerts tabs dropped 4px on Settings because Add an alert made the head 36px.
      - User correction on 2026-10-06. Summary cards were 122px with a badge and 110px without. Now every card has a badge and all are 117px, min-height so wraps still grow.
    maturity: emerging
    health: needs-evidence
    last_reviewed: "2026-10-06"
    decision_refs: []
  - id: foundation.date-fields
    name: Date fields
    level: foundation
    user_goal: Choose the dates for a data file by typing or picking, with the same control everywhere
    objects: [date-input, calendar]
    actions: [type, pick, validate]
    used_in: [Reports, Export]
    entry_points:
      - Reports editor, Date range, Exact dates and First send on
      - Export pop-up, Source data step 2, Exact dates, Common range and Custom range
    structure: Typed dd/mm/yyyy field with a calendar dialog below it, errors under the field
    components: [astral-day-cal, astral-day-cal-menu, astral-date-input, astral-report-pair]
    states: [closed, open, months-view, error]
    permissions: report editors for Reports fields, anyone who can act for Export fields
    content_terms: [Data from, Data to, First send on]
    variants: []
    exceptions:
      - The graph date picker sets a viewing range and keeps its own control
      - Renewal dates on company settings keep the plain typed field
    accessibility: aria-haspopup dialog, aria-expanded, errors linked with aria-describedby and role alert, no calendar opening on focus moved by the code (WCAG 3.2.1, 3.3.1, 3.3.3)
    implementation_refs:
      - prototype.js PROTO_REPORT_DATES
      - prototype.js protoReportDayCalHtml
      - prototype.js protoRangeFieldsHtml
      - prototype.js protoDayCalAllowed
      - prototype.js protoFocusDayCalInput
      - prototype.js protoExportDatesHtml
    evidence:
      - UX patterns review on 2026-10-06. Export Source data used plain From and To fields while Reports used this control for the same task. User approved reuse (commit 7875e05).
    maturity: emerging
    health: needs-evidence
    last_reviewed: "2026-10-06"
    decision_refs: []
  - id: foundation.modal-steps
    name: Modal steps
    level: foundation
    user_goal: Keep a pop-up short when one choice needs many more fields than the others
    objects: [modal, step]
    actions: [continue, go-back, close]
    used_in: [Export]
    entry_points:
      - Export pop-up, Source data, Continue
    structure: Step 1 holds the choice with Continue for the long option. Step 2 has a Back icon before the title, the fields, the summary and the final action. Export source data opens on a review of name and value rows with Change for each stage and a file preview. Change opens one named stage, and Continue or Back returns to the review
    components: [astral-modal, astral-modal-lead, astral-detail-lead, is-step-next, is-step-back, astral-export-review, astral-export-preview]
    states: [step-1, step-2, review, stage, error]
    permissions: anyone who can act
    content_terms: [Continue, Back, Export source data, Change, Data and dates, Values and file]
    variants: []
    exceptions:
      - Choices that need only 1 or 2 extra fields keep them on step 1
      - Settings that change how values read show on the review, never under More options or Advanced
    accessibility: explicit Continue, never advance on radio selection (WCAG 3.2.2), focus to step heading, Back returns focus to the selected option, slide off for reduced motion
    implementation_refs:
      - astral-ui.js protoModalHead backAttr
      - prototype.js protoExportStep
      - prototype.js protoExportStage
      - prototype.js protoExportNext
      - prototype.js protoExportReviewHtml
      - prototype.js protoExportStageHtml
      - prototype.js protoExportPreviewHtml
      - prototype.js protoExportModal
      - prototype.js protoExportModalState
      - styles.css astral-modal-step-next and astral-modal-step-back
    evidence:
      - User request on 2026-10-06 to move Source data to a second step with Back (commit 740f5dd).
      - User decision on 2026-10-19 for a review with Customise stages inside the pop-up, named Data and dates, and Values and file.
      - User correction on 2026-10-19 to remove Customise export. Change is the only way into a stage.
    maturity: emerging
    health: needs-evidence
    last_reviewed: "2026-10-19"
    decision_refs: []
  - id: foundation.form-layout
    name: Form layout
    level: foundation
    user_goal: Match each label to its control and see where each section ends
    objects: [label, legend, field, section]
    actions: [scan, fill]
    used_in: [Export]
    entry_points:
      - Export pop-up, Source data step
    structure: Labels stacked above controls. Label to control 4 to 8px, disclosure head to first section 8px, section to section 16px. Checkboxes and radios centre on the first label line, not on the label and hint. Self-explanatory choice cards show the name only, on one line, all the same size. A form with many kept settings shows them as review rows first, with the fields on stages. Optional extra columns sit under a legend that says what they add. A pick-one-or-more set, such as Meter quantities, uses the same 2-column checkbox cards with its error under the whole set
    components: [astral-field, astral-report-split, astral-export-extras, astral-export-review, astral-export-error, astral-check, astral-radio, astral-report-consent, astral-report-types, astral-report-type]
    states: [default, expanded, error]
    permissions: anyone who can act
    content_terms: [Meter quantities, Active import, Active export, Reactive import, Reactive export, Include completeness, Include meter IDs, Include site details]
    variants: []
    exceptions:
      - A read-only summary with only label and value rows can use a two-column dl
    accessibility: stacked labels survive reflow (WCAG 1.4.10), proximity plus fieldset and legend group labels with controls (WCAG 1.3.1)
    implementation_refs:
      - prototype.js protoExportDatesHtml
      - prototype.js protoExportStageHtml
      - prototype.js protoExportReviewRows
      - styles.css astral-report-split
      - styles.css astral-export-review-list
      - prototype.js protoRangeFieldsHtml
      - prototype.js protoDataMqField
      - prototype.js protoDataCheck
      - styles.css astral-export-pick
    evidence:
      - User corrections on 2026-10-06 on Dates alignment and More options spacing (commit 5c057b4).
      - User corrections on 2026-10-06 on the Date range cards, hints removed and pop-up widened so names fit on one line (commit 44e3e9a).
      - UX patterns and writing review on 2026-10-19. Source data split into What to export, Dates and File, and More options lists its settings when closed.
      - User feedback on 2026-10-19 that people had to scroll and open accordions. Source data became review rows with Customise stages.
      - TMA gap H1 on 2026-10-20 added Meter quantities, Include meter IDs and Include site details, approved as planned by the user.
      - TMA gap H4 on 2026-10-20 added Include completeness for each meter point, approved as planned by the user.
    maturity: emerging
    health: needs-evidence
    last_reviewed: "2026-10-19"
    decision_refs: []
  - id: foundation.why-off-tips
    name: Why-off tips
    level: foundation
    user_goal: Find out why a control cannot be used without notes cluttering the panel
    objects: [control, tooltip]
    actions: [hover, focus]
    used_in: [Chart settings, Date menu]
    entry_points:
      - Chart settings menu on every pane with a graph
      - Date menu, Compare
    structure: The reason for a disabled or limited control shows in a hover and focus tip on that control, never as a note under it
    components: [astral-tip-host, astral-icon-tip, is-why, sr-only]
    states: [disabled, limited]
    permissions: anyone who can see the control
    content_terms: []
    variants: []
    exceptions:
      - Errors the person must fix stay inline and linked to the field
      - Hints needed before acting stay visible
    accessibility: sr-only copy of the reason inside the wrapper, aria-disabled and aria-describedby on single buttons so the tip shows on focus (WCAG 1.3.1, 3.3.2)
    implementation_refs:
      - prototype.js protoWhyOffTip
      - prototype.js protoChartSettings
      - prototype.js protoDateCompareMenuItem
      - styles.css astral-icon-tip.is-why
    evidence:
      - User correction on 2026-10-08, disabled input warnings move into hover tips (commit 1d3a47a).
    maturity: emerging
    health: needs-evidence
    last_reviewed: "2026-10-08"
    decision_refs: []
  - id: foundation.complete-lists
    name: Complete lists
    level: foundation
    user_goal: See and check the whole set when a list is added up, compared, or drawn as a whole
    objects: [tree, table, list]
    actions: [scan, compare, scroll]
    used_in: [Portfolio, Compare]
    entry_points:
      - Portfolio tree, every group and company
      - Breakdown tables under a graph
    structure: Every item loads and draws at once, so counts, totals, and the graph match the rows people see
    components: [astral-tree, astral-breakdown-cols, astral-table]
    states: [loaded, too-much-data]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - Summaries of an already loaded list, such as +3 more in a graph hover, Show more on filter pills, or a pin listing the first seven
    accessibility: Find on page and screen readers reach every row without scrolling first. No loading status part way through a list (WCAG 1.3.2, 2.4.5)
    implementation_refs:
      - prototype.js protoPortfolio
      - prototype.js protoPaintBreakdownRows
      - prototype.js protoPaneListTable
    evidence:
      - User correction on 2026-10-08, the tree loads every site at once instead of batches of 30 (commit c4364e8).
      - User decision on 2026-10-08, Breakdown draws every row at once (commit 35979c9).
    maturity: emerging
    health: healthy
    last_reviewed: "2026-10-08"
    decision_refs: []
  - id: foundation.load-once
    name: Load once
    level: foundation
    user_goal: Move between sub-tabs without waiting again for data that has already loaded
    objects: [tabs, pane]
    actions: [switch, compare]
    used_in: [Portfolio, Settings, Service, Usage, Inbox]
    entry_points:
      - Site, group and meter tabs on Portfolio
      - Settings sections, service tabs and usage tabs
    structure: A sub-tab shows the skeleton on its first visit. Going back to it on the same site, group or meter shows it straight away
    components: [astral-tabs, astral-pane]
    states: [first-visit, already-opened]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - Opening a page or starting the app still runs the screen skeleton
      - Another site, group or meter loads in again
    accessibility: No Loading status is announced when nothing loads. Focus stays on the tab
    implementation_refs:
      - prototype.js protoSkelWatch
      - prototype.js protoSkelKeys
    evidence:
      - User correction on 2026-10-20, no skeleton between sub-tabs when the data has already loaded (commit da654e7).
      - User decision on 2026-10-20, skip it only when going back to a tab already opened.
    maturity: emerging
    health: healthy
    last_reviewed: "2026-10-20"
    decision_refs: []
  - id: foundation.responsive-viewport
    name: Responsive viewport
    level: foundation
    user_goal: Finish a core task in a 1280 x 640 browser viewport, on a laptop or beside Excel, without clipped controls
    objects: [page, pane, graph, table, filter, modal, nav]
    actions: [collapse, stack, reflow, scroll]
    used_in: []
    entry_points:
      - Before a screen is called done
      - /responsive-design
    structure: Measure the viewport → check 1440 x 800, 1280 x 640, 1024 x 600, 1920 x 900, 320 wide → one fix → wait for Yes → re-check all five
    components: [modal, table, filter, tabs, page-header]
    states: [canvas, baseline, compact, wide, reflow, zoom-200]
    permissions: all
    content_terms: []
    variants: []
    exceptions:
      - Data tables and graphs may scroll in two directions inside themselves. The page around them may not.
    accessibility: WCAG 2.2 SC 1.4.10 reflow at 320 CSS px. SC 1.4.12 text spacing. 200% zoom at 1280 wide. Focus is a 2px black edge.
    implementation_refs:
      - styles.css
      - .cursor/skills/responsive-design/SKILL.md
      - .cursor/skills/responsive-design/references/viewport-targets.md
    evidence:
      - Desk research 2026-10-06. Statcounter UK desktop, Windows scaling, WCAG Reflow. General web data, not Astral users.
    maturity: emerging
    health: needs-evidence
    last_reviewed: "2026-10-06"
    decision_refs:
      - UXDR-2026-10-06-viewport-targets
  - id: foundation.related-mpans
    name: Related MPANs
    level: foundation
    user_goal: See that an import and an export MPAN are one supply, and open the other one from the list
    objects: [meter-point, table, file]
    actions: [scan, open, download]
    used_in: [Admin, Portfolio, Meter view, Downloads]
    entry_points:
      - Admin company Meters
      - Portfolio Meter points fold and Compare meter points list, when a meter point exports
      - Site profile Meters table
      - Downloads with Include meter IDs on
    structure: A Direction flow pill, In or Out, then Related MPAN as a link with the partner's pill. Without a partner, muted words say why. Pointing at or tabbing to a row lights its partner's row
    components: [astral-flow-pill, astral-related-ref, astral-related-link, is-pair-lit]
    states: [paired, none, not-recorded, does-not-apply]
    permissions: all
    content_terms: [Direction, Related MPAN, MPAN type, No related MPAN, Not recorded, Does not apply, In, Out, Import, Export]
    variants: [table-cell, meter-view-sentence, file-column]
    exceptions:
      - Lists where no meter point exports leave out Direction and Related MPAN
