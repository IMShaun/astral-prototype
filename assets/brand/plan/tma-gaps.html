<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>TMA MeterPower gap analysis against Astral V1 and V1.1 · IMSERV</title>
<link rel="stylesheet" href="plan.css">
<style>
  /* Source of truth: TMA_Gap_Analysis_Astral_V1_V1.1_2026-10-16.docx (Clive Richardson). Pages fill from the flow below. */
  .page { padding: 0; }
  .flow { position: absolute; left: var(--inset); right: var(--inset); top: 22mm; bottom: 16mm; overflow: hidden; }
  .kicker { font-size: 6.5pt; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 2mm; }
  .title { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gutter); align-items: end; margin-bottom: 5mm; }
  .title h2 { font-size: 21pt; line-height: 1.08; }
  .title p { font-size: 7.5pt; }
  .counts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2.4mm; margin-bottom: 5mm; }
  .counts > div { background: var(--grey-a); padding: 2.4mm 2.8mm; font-size: 6.5pt; line-height: 1.3; }
  .counts > div.crit { background: var(--black); color: var(--white); }
  .counts > div.high { background: var(--cyan); }
  .counts b { display: block; font-size: 15pt; font-weight: 500; line-height: 1; margin-bottom: 1mm; }
  h3.sec { font-size: 12pt; line-height: 1.2; margin: 6mm 0 2mm; padding-top: 2mm; border-top: 0.6mm solid var(--black); }
  .flow > h3.sec:first-child { margin-top: 0; }
  h4.sub { font-size: 8.5pt; font-weight: 600; margin: 4mm 0 1.6mm; }
  .flow p { font-size: 7.6pt; line-height: 1.4; margin-bottom: 2mm; }
  .flow p + p { margin-top: 0; }
  ul.pts { margin: 0 0 2.4mm; padding-left: 4mm; font-size: 7.6pt; line-height: 1.4; }
  ul.pts li { margin-bottom: 1.2mm; }
  ul.pts li b { font-weight: 600; }
  ul.acts { list-style: none; margin: 0 0 2.4mm; padding: 0; font-size: 7.6pt; line-height: 1.4; }
  ul.acts li { display: grid; grid-template-columns: 4.5mm 1fr; padding: 1.2mm 0; border-bottom: 0.25mm solid var(--grey-b); }
  ul.acts li::before { content: ""; width: 2.6mm; height: 2.6mm; border: 0.3mm solid var(--black); margin-top: 0.5mm; }
  ul.acts li span { color: var(--grey-c); }
  table.reg { margin-bottom: 3mm; }
  table.reg th { font-size: 5.8pt; padding: 0 2mm 1.4mm 0; }
  table.reg td { font-size: 6.6pt; line-height: 1.3; padding: 1.2mm 2mm 1.2mm 0; }
  table.reg td:first-child { font-weight: 600; }
  table.reg td.who { color: var(--grey-c); }
  .rate { display: inline-block; font-size: 5.6pt; font-weight: 600; padding: 0.3mm 1.2mm; border-radius: 0.6mm; border: 0.25mm solid var(--black); white-space: nowrap; }
  .rate.critical { background: var(--black); color: var(--white); }
  .rate.high { background: var(--cyan); border-color: var(--cyan); }
  .rate.low { border-color: var(--grey-b); color: var(--grey-c); }
  .st { font-size: 5.8pt; font-weight: 600; white-space: nowrap; }
  .st::before { content: ""; display: inline-block; width: 1.8mm; height: 1.8mm; border-radius: 50%; border: 0.25mm solid var(--black); margin-right: 1mm; vertical-align: -0.2mm; box-sizing: border-box; }
  .st.done::before { background: var(--black); }
  .st.partly::before { background: linear-gradient(90deg, var(--black) 50%, transparent 50%); }
  .st.out { color: var(--grey-c); font-weight: 400; }
  .st.out::before { border-color: var(--grey-b); }
  .pri { display: inline-block; width: 3.8mm; height: 3.8mm; border-radius: 50%; background: var(--cyan); font-size: 5.8pt; font-weight: 600; line-height: 3.8mm; text-align: center; }
  .key { display: flex; flex-wrap: wrap; gap: 1.2mm 4mm; font-size: 6.6pt; margin-bottom: 3mm; }
  .key span.st, .key span.pri { margin-right: 1mm; }
  .note { background: var(--grey-a); border-left: 0.6mm solid var(--cyan); padding: 2.4mm 3mm; margin-bottom: 3mm; }
  .flow .note p { margin: 0; }
  .folio::after { content: "16 Oct 2026 · " counter(pg, decimal-leading-zero); }
</style>
</head>
<body>
<div id="pages"></div>
<template id="chrome">
  <img class="mark mark-left" src="logo/imserv-black.svg" alt="IMSERV">
  <span class="site">imserv.com</span>
  <div class="flow"></div>
  <div class="folio"><span>Internal · TMA gap analysis · Astral</span></div>
</template>
<script>
  const P = (text) => ({ t: "p", text });
  const H = (text) => ({ t: "h3", text });
  const S = (text) => ({ t: "h4", text });
  const L = (items) => ({ t: "ul", items });
  const T = (head, rows, widths) => ({ t: "table", head, rows, widths });
  const rate = (r) => `<span class="rate ${r.toLowerCase()}">${r}</span>`;
  // Parity with TMA, kept by Shaun: can a TMA customer or Ops admin do this in the Astral prototype? Clive's register content is unchanged; these columns are added.
  const STATUS = { yes: "Yes", partly: "Partly", todo: "Not yet", out: "Not a user task" };
  const CLS = { yes: "done", partly: "partly", todo: "todo", out: "out" };
  const st = (s) => `<span class="st ${CLS[s]}">${STATUS[s]}</span>`;
  const pri = (n) => (n ? `<span class="pri">${n}</span>` : "");
  const OURS = {
    C1: ["yes"], C2: ["yes"], C3: ["out"], C4: ["out"], C5: ["yes"], C6: ["partly", 1],
    H1: ["yes"], H3: ["partly", 2], H4: ["yes"], H6: ["yes"], H7: ["yes"], H8: ["yes"], H9: ["yes"],
    M1: ["todo", 3], M2: ["partly", 4], M3: ["partly", 7], M4: ["yes"], M5: ["yes"], M6: ["partly", 8], M7: ["yes"], M8: ["partly", 10], M9: ["partly", 5], M10: ["yes"], M11: ["todo", 6], M12: ["partly", 9],
    L1: ["yes"], L2: ["todo", 11], L3: ["todo", 12], L4: ["yes"],
  };
  const ours = (id) => [st(OURS[id][0]), pri(OURS[id][1])];

  const FLOW = [
    { t: "html", html: `
      <p class="kicker">ASTRAL · TMA METERPOWER GAP ANALYSIS · V1 AND V1.1</p>
      <div class="title">
        <h2>What Astral needs<br>before TMA switches off</h2>
        <p>The TMA MeterPower walk-through on 15 October, Jac's MeterPower overview on 16 October, and a row-by-row check of requirements register v6 and the V1 scope sheet. 36 TMA capabilities in one register. Clive Richardson, 16 October 2026.</p>
      </div>
      <div class="counts">
        <div class="crit"><b>6</b>Critical. These block switch-off</div>
        <div class="high"><b>7</b>High</div>
        <div><b>12</b>Medium</div>
        <div><b>4</b>Low</div>
        <div><b>1</b>Already covered</div>
        <div><b>6</b>Not worth rebuilding</div>
      </div>` },
    H("Parity with TMA at 20 October"),
    P("The aim: a TMA customer, and IMSERV Ops in TMA's admin console, can do everything they do today in Astral, or do it better. Shaun added two columns to Clive's register to test that. Parity asks whether they can do it in the prototype today. Next is the order the prototype work runs in. Of the 29 gaps, 15 are yes, 8 are partly, 4 are not yet and 2 are not a user task."),
    { t: "html", html: `<div class="key">
      <span>${st("yes")}They can do it in the prototype, or better</span>
      <span>${st("partly")}They can do some of it</span>
      <span>${st("todo")}They cannot do it yet</span>
      <span>${st("out")}Data or migration work, no screen</span>
      <span>${pri(1)}Order of work</span>
    </div>` },
    T(["Next", "Work", "Parity", "What is missing"], [
      [pri(1), "C6: customers pull their files from IMSERV's server", st("partly"), "Reports push to the customer's SFTP server; TMA also offers pull"],
      [pri(2), "H3: group and sub group access", st("partly"), "The access map is in the Library; waits on Gordon for V1 and many-to-many"],
      [pri(3), "M1: profile table per channel, with the summary block", st("todo"), "No 48-period table with max demand kVA and load factor"],
      [pri(4), "M2: Compare Data in three modes, with summary statistics", st("partly"), "One comparison mode; Shaun confirms modes 2 and 3"],
      [pri(5), "M9: Ops correct meter point details when the feed is wrong", st("partly"), "Ops can add meter points and change their site, but not correct other details"],
      [pri(6), "M11: placeholder meter until MOP details arrive", st("todo"), "No placeholder meter"],
      [pri(7), "M3: queries IMSERV raised on each meter point", st("partly"), "Customers see their own queries, not ones IMSERV raised"],
      [pri(8), "M6: Ops flow-load log and flow reports", st("partly"), "Servicing shows meter health; no flow-load log"],
      [pri(9), "M12: sub-meters", st("partly"), "Reports by meter class is marked as coming soon"],
      [pri(10), "M8: ROC and LEC, DUoS and TUoS", st("partly"), "Tariffs are on each site; the rest waits on the second session with Jac"],
      [pri(11), "L2: notices panel", st("todo"), "No notices for all customers"],
      [pri(12), "L3: Features and Help pages", st("todo"), "No help screens"],
    ], ["9mm", "", "18mm", ""]),
    P("The prototype only adds. Anything it already shows stays, including the Peak and off-peak values option that the drop list would not rebuild."),

    H("Bottom line"),
    P("V1 as scoped replaces TMA's screens but not its data, feeds or complex-site handling, so on today's evidence it does not replace TMA."),
    L([
      "<b>The gap is the data, not the UI.</b> Channel-level data is a V1 row (Planned), but its detail is in neither the register nor the scope sheet. The July channel spec describes it and parks it outside V1: MSID, MQID mapped from source, effective-dated channels, many meters per MPAN. The import route was still unagreed on 7 Sep, and the register still holds channel data (J-R19) at V4, Open.",
      "<b>Complex sites have no home.</b> Complex and shared-supply sites use a settlement MPAN plus a pseudo MPAN for the raw meters, linked only by a spreadsheet. The settlement value is calculated, not summed: 9,307 against 9,359 from the raw meter on Jac's example.",
      "<b>TMA's 55 FTP customers sit outside the SFTP epic.</b> AST-E-01 (US-04) lists \"TMA schedules (Doug's separate migration project)\" as out of scope and covers push only. TMA also runs pull feeds.",
      "<b>The feed may not exist in time.</b> Channel data from IMSERV systems needs change of agent, and secondary-dial MPANs arrive through a dummy PRN file. No requirement row covers either.",
      "<b>V1.1 carries TMA parity it cannot afford to drop,</b> and the three \"TMA-confirmed\" V1 rows have no TMA source and no user story.",
    ]),
    { t: "note", text: "Wave 1 (w/c 2 Nov) includes all 269 live TMA users, and TMA costs between about £120k and £133k a month. The sources disagree; see Conflicts. On this evidence TMA should not go in wave 1 unless the six critical gaps have named owners and dates at the go/no-go." },

    H("What the session showed TMA actually is"),
    P("TMA (MeterPower v4.3.0, branded Dataserve UK, reached through the ScottishPower VPN) is a thin portal over a rich channel-level data store, plus an admin console Ops use to run the service. IMSERV loses access when the ScottishPower contract ends, and TMA declined admin access for Shaun."),
    T(["Area", "What we saw", "Evidence"], [
      ["What customers use", "Consumption report, generation report, Data Download. Carbon and TOU rarely; Bill Checker never; water and gas \"wishful thinking\"", "Jac, transcript"],
      ["Estate", "1,652 logins, 269 used in the last 45 days (May snapshot); 13,664 unique MPANs across 50,340 group rows. Anna quoted about 12,500 in session", "ELT transition deck v2; transcript"],
      ["Appointments", "64,665 appointment rows, open and closed, all organisations", "Admin report screenshot"],
      ["Largest group", "All HH Scottish Water: 845 MPANs in one group, four FTP groups of 1,000+", "Data Download screenshot; Jac"],
      ["Ingestion", "D0003 files load automatically; the morning file runs 15 to 17.6 MB, about 4,800 to 5,500 flows, 3 to 4.5 minutes. D0010 register-read files also load. Every file in the 1 to 14 Oct log shows zero errors", "Log Viewer screenshots"],
      ["Channels", "Not fixed: standard 1 to 6, but Bathgate WWTW PV uses 1, 2, 8, 9. Import MPAN carries 1, 3, 6 (AI, RI, RE); export MPAN 2, 4, 5 (AE, RI, RE); the rest show \"Unused\". Channels are effective-dated per MSID", "Profile and MPAN admin screenshots"],
      ["Meters", "Multiple meters per MPAN (one MPAN has 16) and multiple MPANs per site", "Jac, Lorraine"],
      ["Time basis", "All data in GMT/UTC; help text warns of the one-hour BST offset", "Features page"],
      ["Access model", "Organisation, Group, Sub Group; users sit at group level; a group grants features; master groups see everything; one MPAN can sit in several groups (customer, consultant, billing marker)", "Jac walk-through; MPAN admin screenshot"],
      ["Onboarding", "Every customer set up by hand by an admin; no self-registration; MPANs added through the account manager", "Anna, Help page"],
      ["Feeds", "Dataserve pulls data and sends it through Serafin, file server or email; customer self-scheduled email reports count as FTP and are charged", "Jac, transcript"],
      ["Support", "Data Provisions mailbox (Sue, Jack on escalations) and the Supplier Help Desk, both IMSERV Scotland branded", "Transcript"],
      ["Data quality", "Agreed site capacity read 0 kVA on all four profiles viewed; the PACE MPANs carry no site address", "Profile screenshots"],
    ], ["24mm", "", "38mm"]),

    H("Gap register"),
    P("Six gaps block switch-off on 31 Dec. Three are build (C1, C2, C5) and three are dependencies outside the Astral team (C3, C4, C6). Coverage today quotes requirements register v6 (row ID, version) and the V1 scope sheet (5 Oct status)."),
    S("Critical: these block switch-off"),
    T(["ID", "Gap", "Coverage today", "What closes it (owner)", "Parity", "Next"], [
      ["C1", "Channel-level data model: MSID, channel, MQID (AI, AE, RI, RE) mapped from source rather than by channel position, effective-dated channels with a closed state, many meters per MPAN. Channel numbers vary by meter operator (1, 2, 8, 9 seen)", "V1 row \"Meter / channel level data\", Planned. J-R19 still V4 Open, \"awaiting scope + data-model check\". E2E plan, 7 Sep: \"need to agree import route. Needs Data Engineer\"", "Commit the model and import route as V1; re-version J-R19 on the Challenges tab (Gordon, Anna)"],
      ["C2", "Register reads (D10): loaded by hand once a month today; customers view and export them; export customers need a monthly export total to claim FIT, Scottish Water for Ofgem reclaim", "ST-04 (V1) covers viewing register reads; a register readings output file reached UAT on 14 Oct. Nothing covers D10 ingestion or monthly export totals; SCW-1 export view is a V1.1 candidate only", "Add D10 ingestion and a monthly export total per export MPAN to V1 (Anna, data team)"],
      ["C3", "Source feed: channel-level data, D10 reads and secondary-dial MPANs arriving automatically; depends on change of agent", "No requirement row. The TMA workbook lists it only as dependencies (\"Secondary Dial to be set up\", \"Update the master CoA plan\")", "Change-of-agent date per cohort and feed confirmed (Lorraine, Lisa)"],
      ["C4", "History before access ends. IMSERV systems lack channel-level history for these MPANs, and TMA Group is for sale", "Generic only: ST-13 historic load; \"Access to historical data\", To scope. TMA workbook question \"Data Extract from TMA for continuity of data? How long, ...\" unanswered", "Extract plan and retention period agreed (Anna, Tricia)"],
      ["C5", "Complex sites, shared SVAs, pseudo MPANs. The settlement MPAN (meter \"COMPLEX\") carries a calculated value; a 99-prefixed pseudo MPAN carries the raw meters; the link lives only in a spreadsheet; calculated and raw totals differ. The TMA workbook holds 121 99-prefixed MPANs, mostly Welsh Water, FTP and Mercia", "None. ST-R6 and J-R12 concern DataVision dummy MPAN labels. TMA workbook, pot 12: \"Risk as very complex... 4 weeks effort by Ian Hall\"", "Model the settlement and pseudo pair; calculated values arrive from upstream, never recomputed; the linking spreadsheet becomes migration data (Gordon, Lisa)"],
      ["C6", "TMA FTP feeds: 55 customers (17 include meter serial, 2 not consolidated by MPAN); pull to Serafile and push to customer servers; a charged service", "V1 SFTP row exists, but epic AST-E-01 (US-04) lists as out of scope \"TMA schedules (Doug's separate migration project)\" and covers push only", "Confirm Doug's project scope, owner and date, or bring TMA feeds into AST-E-01 (Anna)"],
    ].map((r) => [...r, ...ours(r[0])]), ["8mm", "", "", "34mm", "17mm", "7mm"]),
    S("High, medium and low"),
    T(["ID", "Gap", "Coverage today", "Rating", "What closes it (owner)", "Parity", "Next"], [
      ["H1", "Data Download options: MQs, kWh or kW, actuals only, A/E flags on or off, consolidate by MPAN, aggregate by group, MSID, site details, interval, cumulative or TOU; search across 845 MPANs; runs as a background job", "\"Data download / export\" Partial; LCC-03, ST-02, VMO2-R2, ST-R1, VR-03 (V1) are generic; the option set is unspecified", "High", "Parity spec from Jac's option list; golden extracts as acceptance tests (Anna, Jac)"],
      ["H3", "Organisation, Group, Sub Group access with group-level feature rights; one MPAN in many groups (12,803 of 13,658 MPANs sit in more than one, up to 11)", "JV-R1, ST-R5, SW-04, VR-04 (V1); SCW-11/12 V1.1 candidates. \"Group Functionality\" is MVP+ in the tracker but V1 in the scope sheet", "High", "Settle the version conflict as V1; confirm many-to-many (Gordon)"],
      ["H4", "Generation and consumption reports, the main reasons customers log in", "Generation widget Built; GS-R8 and ST-11 (V1) cover import and export data; no named reports", "High", "Add both as V1 report rows (Anna)"],
      ["H6", "Related import and export MPAN pairs; MPAN type", "ST-11 per-site import/export flag only", "High", "Add related MPAN to site attributes (Gordon)"],
      ["H7", "Users with no email (about 308 of 1,653 user rows in the TMA workbook; the ELT deck counts 1,652 logins); third-party authorisation held in free-text notes", "VR-11 (V1) moves login and reset to email, which conflicts. LOA row Built per the 7 Sep E2E plan, To scope per 5 Oct", "High", "No-email rule in the transition plan; notes into the authority gate (Anna, Tricia)"],
      ["H8", "Stale portfolios: a D0151 does not reliably close the link and nothing removes sites afterwards", "GS-R3 (V1) de-appointment notification only", "High", "Cleanse against current appointments before migration (Lisa, Tricia)"],
      ["H9", "Three data cuts a day (about 7:30, 9 to 10 and 3 to 4pm)", "TW-01, ST-05, JV-R18, LCC-08, VMO2-R8, SW-01 (V1) cover freshness; none states intraday", "High", "Confirm refresh frequency or tell customers (data team)"],
      ["M1", "Profile table: 48 periods per channel, kW, kWh or kVA, transpose, summary of total, max and min, max demand kVA and load factor", "Tabular interval view To scope; Statistics tab Built", "Medium", "Specify per channel with the summary block (Shaun)"],
      ["M2", "Compare Data in three modes, with summary statistics", "Comparison overlay Partial; SCW-9/10", "Medium", "Confirm modes 2 and 3 (Shaun)"],
      ["M3", "Enquiry: read-only history of queries IMSERV raised per MPAN", "Capture-only flag in V1; query management through Salesforce, 2027", "Medium", "Accept; say so in comms (Anna)"],
      ["M4", "Alarm report and alarm email", "Alerts Not started", "Medium", "Usage unknown (Jac cannot see it); decide with account managers (Anna)"],
      ["M5", "All data in GMT", "Report content includes UTC", "Medium", "Default TMA exports to GMT (Gordon)"],
      ["M6", "Ops monitoring: flow log, flow listing, channel overlap, flow loading reports", "Not in portal scope", "Medium", "Name where ingestion monitoring lives (Lisa)"],
      ["M7", "Support through the Data Provisions mailbox and Supplier Help Desk; Katie Horton runs onboarding and FTP links", "No portal-wide support row; DD-10 covers document delivery only", "Medium", "Route into the tier model before wave 1 (Anna, Pippa)"],
      ["M8", "ROC and LEC, tariffs, DUOS and TUOS, category", "ROC and LEC V3; tariffs In progress; DUOS and TUOS not itemized", "Medium", "Second session with Jac (Anna)"],
      ["M9", "Manual MPAN maintenance when the feed is wrong", "Address read-only; no channel admin", "Medium", "Define the exception route (Lisa)"],
      ["M10", "Agreed capacity 0 kVA and missing addresses on MPANs viewed", "Address read-only from source; V1.1 capacity relies on customer entry", "Medium", "Size ASC and address coverage (data team)"],
      ["M11", "Dummy meter held against an MPAN until MOP technical details arrive", "None", "Medium", "Model allows a placeholder meter (Gordon)"],
      ["M12", "Sub-meters to set up (TMA workbook: \"500 / 900\")", "JCH sub-metering treatment; SCW-4 candidate", "Medium", "Confirm count and treatment (Lisa)"],
      ["L1", "Carbon report", "Site emissions Planned", "Low", "Covered once built"],
      ["L2", "Notices panel", "Not itemized", "Low", "Banner on the help framework"],
      ["L3", "Features and Help pages", "Help screens Planning", "Low", "Covered"],
      ["L4", "Simulate User View (broken in TMA today)", "Login as a user Planned", "Low", "Covered"],
    ].map((r) => [r[0], r[1], r[2], rate(r[3]), r[4], ...ours(r[0])]), ["8mm", "", "", "13mm", "30mm", "17mm", "7mm"]),
    { t: "note", text: "Already covered: missing and estimated data. WS-27, ST-14 and JC-R1 (V1), the data quality flags row (Planning) and story 4070 cover it. Jac says it is the main reason customers raise queries (N/A for missing, blue for estimated, ND for no data), so it must not slip." },

    H("V1.1 is carrying TMA parity"),
    P("Three of the nine V1.1 candidates are things TMA customers have today, and a fourth (data health) exists in basic form. Yet the 6 Oct migration plan defines V1.1 as the droppable tranche, cut first if V1 slips. Anything a TMA customer needs on 1 Jan cannot sit there."),
    T(["V1.1 candidate", "TMA has it today?", "Position for TMA switch-off"], [
      ["Export and sub-meter channel data (SCW-1)", "Yes: channel view, export MPANs", "Move to V1 (part of C1, C2); also re-version J-R19 from V4"],
      ["Group-by-class reporting (SCW-4)", "Yes: groups such as All HH Scottish Water, All AMR Sites", "Move to V1"],
      ["Granular and framework access (SCW-11, 12)", "Yes: sub-groups scope consultants", "Move to V1 (H3; also a version conflict, MVP+ against V1)"],
      ["Data-health view", "Basic form: missing and no-data reports", "Basic reporting already V1 (WS-27, ST-14, JC-R1); rich view stays V1.1"],
      ["Capacity and kVA", "Partly: ASC and max demand kVA on the profile", "Stays V1.1; ASC data is thin (M10)"],
      ["Threshold alerts with LOA status", "Partly: alarm report and email", "Stays V1.1 unless alarm usage is material (M4)"],
      ["Cross-site league tables", "No", "Stays V1.1"],
      ["what3words overlay", "No", "Stays V1.1"],
      ["Company-level map", "No", "Stays V1.1"],
    ], ["52mm", "", ""]),
    P("One definition to settle: the sources use V1.1 three ways. The register documents treat it as the pull-forward candidates above. An earlier prototype session scoped it as Portfolio, Reports, Alerts, Queries, Settings and Notifications. The ELT transition deck uses it for CRM-enforced access. This analysis uses the register definition (Reports v1/v1.1 document, 24 Sep). The locked register has no V1.1 column, only V1 to V4, so nothing in V1.1 is formally committed."),

    H("Where the session challenges current V1 rows"),
    P("The three \"TMA-confirmed\" rows added to V1 do not match what TMA does. The TMA requirements folder holds one document, Portal Requirements.docx, which reads as a generic best-practice list for a commercial energy portal, not a TMA baseline. The rows look derived from it, though that is inference. What is fact: the scope sheet calls them \"directed additions\", the 15 Sep story reconciliation marks all three \"NO STORY\", and no interview or TMA document supports them. One traces to a register row: external data ingestion maps to MO-R4 (V1), a third-party and sub-metering upload need, not a TMA one. \"Supplier D3\" may be a mislabelled D0003, the standard half-hourly flow."),
    T(["Current V1 row", "What the session showed", "Proposed rewrite"], [
      ["Meter read submission (user submits a read)", "Customers do not submit reads in TMA. IMSERV loads D10 register reads and customers view and export them", "Register read (D10) ingestion, display and export, plus monthly export totals (C2)"],
      ["External data ingestion (for example, supplier D3)", "Manual upload of D3, PRN/MTD, site setup and appoint/assign files is an Ops workaround; Lorraine wants it automated", "Automated feed for appointed and secondary-dial MPANs, channel-level, from the governed layer (C3); manual upload as an admin exception only"],
      ["Data collector / aggregator (DC/DA) reports", "No DC/DA report was shown. \"DC/DA Customer Invoicing via CDAM\" is a billing-marker group, not a report", "Replace with the generation and consumption reports customers actually use (H4); confirm whether any DC/DA report exists"],
    ], ["40mm", "", ""]),
    L([

  const pages = document.getElementById("pages");
  const chrome = document.getElementById("chrome");
  let flow;
  const newPage = () => {
    const page = document.createElement("div");
    page.className = "page paper";
    page.appendChild(chrome.content.cloneNode(true));
    pages.appendChild(page);
    flow = page.querySelector(".flow");
  };
  const fits = () => flow.scrollHeight <= flow.clientHeight + 0.5;
  const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
  // A heading never ends a page on its own: it moves down with the block after it.
  const place = (node, keepWith) => {
    flow.appendChild(node);
    if (fits()) return;
    flow.removeChild(node);
    const moved = keepWith && flow.lastElementChild === keepWith ? keepWith : null;
    if (moved) flow.removeChild(moved);
    newPage();
    if (moved) flow.appendChild(moved);
    flow.appendChild(node);
  };
  const tableHead = (b) => `<table class="reg"><colgroup>${b.head.map((_, i) => `<col${b.widths?.[i] ? ` style="width:${b.widths[i]}"` : ""}>`).join("")}</colgroup><thead><tr>${b.head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody></tbody></table>`;

  const run = () => {
    newPage();
    let lastHead = null;
    for (const b of FLOW) {
      if (b.t === "h3" || b.t === "h4") {
        const node = el(b.t === "h3" ? `<h3 class="sec">${b.text}</h3>` : `<h4 class="sub">${b.text}</h4>`);
        place(node, b.t === "h4" ? lastHead : null);
        lastHead = node;
        continue;
      }
      if (b.t === "table") {
        let table = el(tableHead(b));
        const keep = lastHead;
        place(table, keep);
        for (const r of b.rows) {
          const tr = el(`<table><tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr></table>`).querySelector("tr");
          table.tBodies[0].appendChild(tr);
          if (fits()) continue;
          table.tBodies[0].removeChild(tr);
          const empty = !table.tBodies[0].rows.length;
          if (empty) flow.removeChild(table);
          const moved = empty && keep && flow.lastElementChild === keep ? keep : null;
          if (moved) flow.removeChild(moved);
          newPage();
          if (moved) flow.appendChild(moved);
          table = el(tableHead(b));
          flow.appendChild(table);
          table.tBodies[0].appendChild(tr);
        }
        lastHead = null;
        continue;
      }
      if (b.t === "ul" || b.t === "acts") {
        const cls = b.t === "ul" ? "pts" : "acts";
        let list = el(`<ul class="${cls}"></ul>`);
        place(list, lastHead);
        for (const item of b.items) {
          const li = el(b.t === "ul" ? `<li>${item}</li>` : `<li><div>${item[0]} <span>(${item[1]})</span></div></li>`);
          list.appendChild(li);
          if (fits()) continue;
          list.removeChild(li);
          if (!list.children.length) flow.removeChild(list);
          newPage();
          list = el(`<ul class="${cls}"></ul>`);
          flow.appendChild(list);
          list.appendChild(li);
        }
        lastHead = null;
        continue;
      }
      const node = b.t === "html" ? el(`<div>${b.html}</div>`) : b.t === "note" ? el(`<div class="note"><p>${b.text}</p></div>`) : el(`<p>${b.text}</p>`);
      place(node, lastHead);
      lastHead = null;
    }
    window.__pages = pages.children.length;
    window.__ready = true;
  };
  document.fonts.ready.then(run);
</script>
