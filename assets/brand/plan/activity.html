<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Customer discovery · Research plan · IMSERV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="plan.css">
<style>
  /* Additions for issued activity plans. Same tokens as plan.css. */
  .title-block h1.fit { font-size: 54pt; }
  .kicker { font-weight: 600; font-size: 7pt; letter-spacing: 0.02em; margin-bottom: 3mm; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gutter); border-top: 0.6mm solid var(--black); padding-top: 3mm; }
  .facts + .facts { margin-top: 6mm; }
  .stages { position: absolute; left: var(--inset); bottom: 22mm; width: calc((100% - 2 * var(--inset) - var(--gutter)) / 2); }
  .stages li { display: grid; grid-template-columns: 7mm 1fr; padding: 1.6mm 0; border-bottom: 0.25mm solid var(--grey-b); font-size: 8pt; }
  .stages li.on { font-weight: 600; }
  .stages li.on span:first-child::before { content: ""; display: inline-block; width: 2mm; height: 2mm; background: var(--cyan); margin-right: 1.2mm; vertical-align: 0.2mm; }
  .stages ol { list-style: none; padding: 0; }
  .card p { font-size: 8.5pt; }
  .tl-bar.off { background: var(--grey-b); }
  .tl-row.on .tl-name { font-weight: 600; }
  .agenda > div.blank { background: var(--grey-a); }
  .quote { font-size: 13pt; line-height: 1.3; font-weight: 500; }
  td.n { width: 8mm; font-weight: 600; }
  .relations { display: flex; gap: 2mm; flex-wrap: wrap; margin-top: 3mm; }
  .stack > * + * { margin-top: 6mm; }
</style>
<script src="customer-discovery.js"></script>
</head>
<body>
<main id="doc"></main>
<script>
(function () {
  const P = window.PLAN;
  const key = new URLSearchParams(location.search).get("a") || "overview";
  const act = P.activities.find((a) => a.id === key);
  const pad = (n) => String(n).padStart(2, "0");
  const folio = `<div class="folio"><span>${P.folio}</span></div>`;
  const ul = (items) => `<ul class="plain">${items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
  const pages = [];
  const add = (sec, cls, inner, style) => pages.push({ sec, cls, inner, style: style || "" });
  const photo = (name, pos) => `background-image:url('photos/${name}.jpg')${pos ? `;background-position:${pos}` : ""}`;
  const odd = act ? act.n % 2 === 1 : true;

  const table = (cols, rows, widths) => `
    <table>
      <thead><tr>${cols.map((c, i) => `<th${widths && widths[i] ? ` style="width:${widths[i]}"` : ""}>${c}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>`;

  const head = (title, text) => `<div class="head"><h2>${title}</h2>${text ? `<p>${text}</p>` : "<div></div>"}</div>`;

  const cover = (title, sub, fit) =>
    add(null, "photo grid-cover", `
      <img class="mark mark-top" src="logo/imserv-white.svg" alt="IMSERV">
      <div class="title-block"><h1${fit ? ' class="fit"' : ""}>${title}</h1></div>
      <p class="title-sub">${sub}</p>`,
      photo(odd ? "cover-forest-road" : "cover-mountain"));

  const summary = () => add("__summary", "photo summary", "", photo(odd ? "summary-wind-turbine" : "summary-pylons", "28% center"));

  const divider = (title, kind) => {
    if (kind === "photo") {
      add(null, "photo", `<img class="mark mark-left" src="logo/imserv-white.svg" alt="IMSERV"><div class="divider-title left"><h2>${title}</h2></div>`,
        photo(odd ? "divider-hill-road" : "divider-pylon"));
    } else {
      add(null, `${kind || "cyan"} dots`, `<img class="mark mark-top" src="logo/imserv-black.svg" alt="IMSERV"><div class="divider-title"><h2>${title}</h2></div>`);
    }
  };

  const timeline = (current) => {
    const rows = P.activities.map((a) => {
      const left = (a.weeks[0] / 18) * 100;
      const width = ((a.weeks[1] - a.weeks[0]) / 18) * 100;
      const on = !current || current === a.id;
      return `<div class="tl-row${current === a.id ? " on" : ""}"><div class="tl-name">${a.n}. ${a.short}</div><div class="tl-track"><span></span><span></span><span></span><span></span><span></span><span></span><i class="tl-bar${on ? "" : " off"}" style="left:${left}%;width:${width}%"></i></div></div>`;
    }).join("");
    const labels = ["WK 1–3", "WK 4–6", "WK 7–9", "WK 10–12", "WK 13–15", "WK 16–18"].map((l) => `<span>${l}</span>`).join("");
    const stages = table(["Stage", "Provisional duration", "Depends on"],
      P.activities.filter((a) => !current || a.id === current).map((a) => [`${a.n}. ${a.title}`, a.duration, a.depends]), ["30%", "26%"]);
    add("Schedule", "paper", `
      ${head(current ? "Where it<br>sits" : "Provisional<br>timeline", P.timelineNote)}
      <div class="timeline"><div class="tl-row tl-head"><div></div><div class="tl-track">${labels}</div></div>${rows}</div>
      <div style="margin-top:12mm">${stages}</div>
      ${folio}`);
  };

  const consent = () => add("Consent and data", "ink", `
    <div class="band"><p>Neutral draft. No consent wording is sent until it is approved. Legal review before it reaches a participant.</p></div>
    <h2 class="big-head after-band">Consent, privacy<br>and data</h2>
    <p class="lede">Agreed with IMSERV's privacy and data-protection owner before the first session.</p>
    <div class="cols">
      <div><h3>Every session</h3>${ul(P.consent)}</div>
      <div><h3>How AI is used</h3><p>${P.ai.can}</p><p>${P.ai.not}</p></div>
    </div>
    ${folio}`);

  const risks = (ids, title) => add("Risks", "paper", `
    ${head(title || "Risks and<br>limits", "What could weaken the evidence, and what we do about it.")}
    ${table(["Risk", "Effect", "Mitigation"], ids.map((id) => { const r = P.risks[id]; return [r.risk, r.effect, r.fix]; }), ["32%", "30%"])}
    ${folio}`);

  const closing = () => add(null, "photo grid-close", `
    <img class="mark mark-left" src="logo/imserv-white.svg" alt="IMSERV">
    <span class="site">imserv.com</span>
    <div class="thanks"><h2>Thank<br><span class="accent">You</span></h2></div>
    <div class="contact"><div class="avatar"></div><div>${P.owner}<br>${P.team}</div></div>`,
    photo(odd ? "closing-road-van" : "closing-van-valley"));

  const objectiveRows = (ns) => P.objectives.filter((o) => ns.includes(o.n)).map((o) => [`${o.n}. ${o.verb}`, o.question, o.evidence, o.measure]);

  function activityPages(a) {
    const next = P.activities.find((x) => x.n === a.n + 1);
    cover(a.cover, `${P.title}<br>Activity ${a.n} of ${P.activities.length} · ${P.status} · ${P.date}`, a.cover.length > 22);
    summary();

    add("Purpose", "paper", `
      <p class="kicker">ACTIVITY ${a.n} OF ${P.activities.length}</p>
      <h2 class="big-head">${a.title}</h2>
      <p class="lede">${a.purpose}</p>
      <div class="facts"><div><p class="label">PROVISIONAL DURATION</p><p>${a.duration}</p></div><div><p class="label">DEPENDS ON</p><p>${a.depends}</p></div></div>
      <div class="facts"><div><p class="label">OUTPUT</p><p>${a.output}</p></div><div><p class="label">${a.objectives.length ? "OBJECTIVES IT SERVES" : "WHAT WE NEED FROM REVIEWERS"}</p>${
        a.objectives.length
          ? ul(P.objectives.filter((o) => a.objectives.includes(o.n)).map((o) => `${o.n}. <b style="font-weight:500">${o.verb}</b> ${o.text}`))
          : ul(a.asks.map((i) => P.asks[i - 1]))
      }</div></div>
      <div class="stages"><p class="label">THE SEVEN ACTIVITIES</p><ol>${P.activities.map((x) => `<li class="${x.id === a.id ? "on" : ""}"><span>${x.n}</span><span>${x.title}</span></li>`).join("")}</ol></div>
      <div class="callout"><p class="label">PRIMARY RESEARCH QUESTION</p><p class="say">${P.primary}</p></div>
      ${folio}`);

    divider("What<br>happens");

    add("What happens", "paper", `
      ${head("What<br>happens", a.format || a.purpose)}
      <div class="cards fill tall">${a.steps.map((s, i) => `<div class="card"><div class="num">${i + 1}</div><div><h3>${s.h}</h3><p>${s.p}</p></div></div>`).join("")}</div>
      ${folio}`);

    if (a.stat) {
      add("What happens", "paper", `
        ${head("Sample<br>this round", "Two rounds of 6 to 8 is a starting proposal, not a promise of coverage. Plan rounds, not a total.")}
        <div class="stat"><p class="stat-lede">${a.stat.lede}</p><p class="stat-unit">${a.stat.unit}</p><p class="stat-num">${a.stat.n}</p></div>
        ${folio}`);
    }

    detail(a);

    divider("Plan and<br>safeguards", "photo");
    timeline(a.id);

    if (a.objectives.length) {
      add("Objectives", "paper", `
        ${head("Objective-to-<br>evidence", "How this activity answers the objectives. Measures serve an objective. They are not collected for their own sake.")}
        ${table(["Objective", "Research question", "Evidence", "Measure"], objectiveRows(a.objectives), ["20%", "30%", "25%"])}
        ${folio}`);
    } else {
      add("Objectives", "paper", `
        ${head("What we<br>are asking for", "This plan is the proposal for the conversation with Clive. He has <b>not</b> agreed a research plan, scope, or sample size.")}
        ${table(["", "Ask", "Status"], a.asks.map((i) => [String(i), P.asks[i - 1], `<span class="tag">To agree</span>`]), ["8mm", "", "16%"])}
        <div class="cols" style="margin-top:14mm"><div><h3>Decision to inform</h3>${ul(P.decisions)}</div><div><h3>None of this is a finding yet</h3><p>Everything here is a proposed approach. It is grounded in UX and mixed-methods guidance. <b>None of it is a finding about IMSERV customers yet.</b></p></div></div>
        ${folio}`);
    }

    if (a.consent) consent();
    risks(a.risks);

    add("Output", "paper", `
      <div class="band"><p>${a.output}</p></div>
      <h2 class="big-head after-band">Output</h2>
      <p class="lede">Early findings reach the BA team from round 1, not only at the end.</p>
      <div class="cols">
        <div><h3>Hands over to</h3>${
          next
            ? `<p><b style="font-weight:500">Activity ${next.n}. ${next.title}.</b></p><p>${next.purpose}</p>`
            : `<p><b style="font-weight:500">Prioritised UX decisions.</b></p><p>Each one traceable to evidence, and ready for the BA team to turn into stories.</p>`
        }</div>
        <div><h3>Working alongside the BA team</h3>${ul(P.ba)}</div>
      </div>
      ${folio}`);

    closing();
  }

  function detail(a) {
    if (a.detail === "scope") {
      add("Scenarios and evidence", "paper", `
        ${head("Possible starting<br>scenarios", "Two or three priority scenarios to follow in depth. To confirm, not agreed.")}
        ${table(["Scenario", "Status"], P.scenarios.map((s) => [s, `<span class="tag">To confirm</span>`]), ["", "18%"])}
        <div class="cols" style="margin-top:14mm"><div><h3>Decision to inform</h3>${ul(P.decisions)}</div><div><h3>Agree how findings reach the BA team</h3>${ul(P.ba)}</div></div>
        ${folio}`);
      add("Scenarios and evidence", "paper", `
        ${head("What we<br>already know", "Record what these sources already answer, so we do not ask again. Every item has a source and a limit.")}
        ${table(["Evidence", "Source", "Limit"], P.known.map((k) => [k.text, k.source, k.limit]), ["44%", "22%"])}
        ${folio}`);
      add("Scenarios and evidence", "paper", `
        <h2 class="big-head">Assumed and<br>not yet known</h2>
        <p class="lede">The research repository has no studies, insights, archetypes, or experience scores yet.</p>
        <div class="cols kau block"><div><p class="label">ASSUMED</p>${ul(P.assumed)}</div><div><p class="label">UNKNOWN</p>${ul(P.unknown)}</div></div>
        ${folio}`);
    }
    if (a.detail === "recruitment") {
      add("Recruitment", "paper", `
        ${head("Recruitment<br>matrix", "We will not try to fill every combination. We prioritise contrasts likely to change a design decision, then recruit into gaps as findings emerge.")}
        ${table(["Dimension", "Examples"], P.matrix, ["34%"])}
        ${folio}`);
      add("Recruitment", "paper", `
        <h2 class="big-head">Who we<br>recruit</h2>
        <p class="lede">In business services, separate the buyer, administrator, practitioner, approver, and recipient of outputs. A senior contact may not do the everyday work.</p>
        <div class="cols-3 kau block">
          <div><p class="label">STARTING POINT</p><p>Energy, Finance, Asset, and Data hats are a starting point for screening. They are not the archetypes.</p></div>
          <div><p class="label">NOT A STAND-IN</p><p>Account managers and internal experts help with recruitment and service context. They do not stand in for customer practitioners.</p></div>
          <div><p class="label">EXCLUSIONS</p><p>IMSERV staff standing in for customers. People who designed the flows being discussed.</p></div>
        </div>
        ${folio}`);
    }
    if (a.detail === "questions") {
      add("Discovery questions", "paper", `
        <div class="band"><p>“${P.opener}”</p></div>
        <div class="head after-band"><h2>Discovery<br>questions</h2><p>We ask about the last real time, not about features. Then we follow that episode through its tools, decisions, and handoffs.</p></div>
        ${table(["Area", "Discovery questions"], P.questions, ["34%"])}
        ${folio}`);
    }
    if (a.detail === "saturation") {
      add("When to stop", "paper", `
        <h2 class="big-head">When to keep<br>recruiting</h2>
        <p class="lede">A rare, high-impact need is not dropped because it appeared once.</p>
        <div class="cols-3 kau block">
          <div><p class="label">CONTEXTS</p><p>Important contexts are still unexplored.</p></div>
          <div><p class="label">DIFFERENCES</p><p>New behavioural differences keep appearing.</p></div>
          <div><p class="label">CONTRADICTIONS</p><p>Consequential contradictions are unresolved.</p></div>
        </div>
        <div class="cols block" style="margin-top:14mm">
          <div><h3>On sample size</h3><p>GOV.UK suggests about 4 to 8 participants per qualitative round, with more rounds as needed.</p><p>A systematic review found saturation often within 9 to 17 interviews, in fairly similar groups with narrow aims (Hennink and Kaiser, 2022).</p></div>
          <div><h3>What that does not show</h3><p>It does <b>not</b> show 12 to 16 interviews are enough for IMSERV's varied, multi-role audience. Two rounds of 6 to 8 is a starting proposal, not a promise of coverage.</p></div>
        </div>
        ${folio}`);
    }
    if (a.detail === "survey") {
      add("Survey design", "paper", `
        ${head("Ask about<br>behaviour", "Build questions from discovery findings, in customers' own words. Ask about behaviour, not about which persona someone is.")}
        ${table(["Ask this", "Not this"], [["In the past three months, how often have you compared figures from more than one source before sharing a report?", "Are you an evidence-led analyst?"]], ["62%"])}
        <div class="cols" style="margin-top:12mm"><div><h3>Rules</h3>${ul(P.surveyRules)}</div><div><h3>Why not start with the survey</h3><p>A survey written before discovery measures our own assumptions. It may:</p>${ul(["miss activities customers think are important", "use words that do not match how people describe their work", "force people into categories that do not fit", "collect feature wishes instead of explaining needs"])}</div></div>
        ${folio}`);
    }
    if (a.detail === "joint") {
      add("Joint evidence", "paper", `
        <div class="band"><p>Triangulation does not mean three sources agreed, so it is true. Sources can share a bias.</p></div>
        <div class="head after-band"><h2>Joint evidence<br>table</h2><p>Interviewing and surveying the same customer champions adds detail, not independent coverage.</p></div>
        ${table(["Research question", "Interview", "Walkthrough or artefact", "Survey", "Interpretation and next action"], P.joint, ["22%", "18%", "20%", "17%"])}
        <p style="margin-top:6mm">Each relationship is marked:</p>
        <div class="relations"><span class="tag">SUPPORTING</span><span class="tag">COMPLEMENTARY</span><span class="tag">CONFLICTING</span><span class="tag">INSUFFICIENT</span></div>
        <p style="margin-top:6mm">For example, someone may say they use the portal for reporting. A walkthrough may show the final report is built elsewhere. That is not dishonest. Reporting may mean getting the starting data.</p>
        ${folio}`);
    }
    if (a.detail === "chain") {
      add("From evidence to decision", "paper", `
        ${head("From evidence<br>to decision", "Each decision follows one chain, so it stays traceable into BA work. Observation, interpretation, and recommendation stay separate, with links back to the evidence.")}
        <div class="agenda">${P.chain.map((c, i) => `<div><span class="tag">STEP ${i + 1}</span><h3>${c}</h3></div>`).join("")}</div>
        <div class="callout"><p class="label">THE TEST FOR EVERY ARCHETYPE</p><p class="say">Would this profile change how we design, prioritise, or evaluate a real task?</p></div>
        ${folio}`);
    }
  }

  function overviewPages() {
    cover("Customer<br>discovery", `${P.title} · Research plan<br>${P.status} · ${P.date}`);
    summary();
    divider("Why we are<br>doing this");

    add("Summary", "paper", `
      <h2 class="big-head">Summary</h2>
      <p class="lede">We want to run a research-led discovery with IMSERV customers. It should produce three things.</p>
      <div class="cols-3 kau block">
        <div><p class="label">BEHAVIOURAL ARCHETYPES</p><p>How people actually work, what they need, and what changes the design.</p></div>
        <div><p class="label">CUSTOMER JOURNEYS</p><p>Evidence-backed. What happens today, including work outside Astral.</p></div>
        <div><p class="label">PRIORITISED UX DECISIONS</p><p>Each one traceable to evidence, and ready for the BA team to turn into stories.</p></div>
      </div>
      <div class="cols block" style="margin-top:12mm">
        <div><h3>Where this stands</h3><p>Clive has offered to help unlock customer access. He has <b>not</b> agreed a research plan, scope, or sample size. This plan is the proposal for that conversation.</p></div>
        <div><h3>Decision to inform</h3>${ul(P.decisions)}</div>
      </div>
      <div class="callout"><p class="label">NOT A FINDING YET</p><p class="say">Everything here is a proposed approach. None of it is a finding about IMSERV customers yet.</p></div>
      ${folio}`);

    add("What we are asking for", "paper", `
      ${head("What we are<br>asking for", "Six things we need from reviewers before the research starts.")}
      ${table(["", "Ask", "Status"], P.asks.map((ask, i) => [String(i + 1), ask, `<span class="tag">To agree</span>`]), ["8mm", "", "16%"])}
      ${folio}`);

    add("Background", "paper", `
      ${head("What we<br>already know", "Every item has a source and a limit. The research repository has no studies, insights, archetypes, or experience scores yet.")}
      ${table(["Evidence", "Source", "Limit"], P.known.map((k) => [k.text, k.source, k.limit]), ["44%", "22%"])}
      ${folio}`);

    add("Background", "paper", `
      <h2 class="big-head">Assumed and<br>not yet known</h2>
      <p class="lede">Beliefs we have not tested with customers, and the gaps that matter to the decision.</p>
      <div class="cols kau block"><div><p class="label">ASSUMED</p>${ul(P.assumed)}</div><div><p class="label">UNKNOWN</p>${ul(P.unknown)}</div></div>
      ${folio}`);

    add("Objectives", "paper", `
      <div class="head"><h2>Objectives and<br>questions</h2><div><p class="label">PRIMARY RESEARCH QUESTION</p><p style="font-size:11pt;line-height:1.3">${P.primary}</p></div></div>
      ${table(["Objective", "Research question", "Activity", "Evidence", "Measure"], P.objectives.map((o) => [`${o.n}. ${o.verb}`, o.question, o.activity, o.evidence, o.measure]), ["16%", "24%", "20%", "20%"])}
      ${folio}`);

    divider("How we will<br>run it", "photo");

    add("Approach", "paper", `
      <div class="band"><p>Review existing evidence → interview and observe → find provisional patterns → survey those patterns → follow up on contradictions → refine archetypes and journeys → test design implications.</p></div>
      <h2 class="big-head after-band">Approach</h2>
      <p class="lede">An exploratory sequential mixed-methods discovery. Qualitative research comes first. It sets the concepts and language that the survey then measures.</p>
      <div class="cols">
        <div><h3>Connected, not just collected</h3><p>Interviews build the survey. Survey results guide follow-up recruitment. Both are compared in one analysis (Fetters, Curry and Creswell).</p><p>A <b>short screener</b> is still used for recruitment. That is different from the main survey.</p></div>
        <div><h3>Archetypes, not decorative personas</h3><p>We will define research-backed behavioural profiles and customer journeys. The profiles do the job of personas, without fictional biographies.</p><p>Archetypes come from recurring patterns. They are not job titles with a new label.</p></div>
      </div>
      ${folio}`);

    add("Research activities", "paper", `
      ${head("Research<br>activities", "Seven connected activities. Each has its own plan with purpose, steps, schedule, safeguards, and output.")}
      <div class="agenda">${P.activities.map((a) => `<div><span class="tag">ACTIVITY ${a.n}</span><h3>${a.title}</h3><p>${a.purpose}</p><p class="muted">${a.duration}</p></div>`).join("")}
        <div><span class="tag">OVERALL</span><h3>12 to 18 weeks</h3><p>With overlap, from agreement to tested implications.</p></div>
        <div class="blank"></div>
      </div>
      ${folio}`);

    timeline(null);
    consent();
    risks(Object.keys(P.risks));
    closing();
  }

  if (act) activityPages(act); else overviewPages();

  // Summary list, from the section of each page.
  const ranges = [];
  pages.forEach((p, i) => {
    if (!p.sec || p.sec === "__summary") return;
    const last = ranges[ranges.length - 1];
    if (last && last.sec === p.sec && last.to === i) last.to = i + 1;
    else ranges.push({ sec: p.sec, from: i + 1, to: i + 1 });
  });
  const summaryPage = pages.find((p) => p.sec === "__summary");
  if (summaryPage) {
    summaryPage.inner = `<h2>${act ? `Activity ${act.n}<br>${act.title}` : "Summary"}</h2><ol>${ranges
      .map((r) => `<li><span>${r.sec}</span><span>${pad(r.from)}${r.to > r.from ? `–${pad(r.to)}` : ""}</span></li>`)
      .join("")}</ol>`;
  }

  document.title = `${act ? `Activity ${act.n} · ${act.title}` : "Research plan"} · ${P.title} · IMSERV`;
  document.getElementById("doc").innerHTML = pages
    .map((p) => `<section class="page ${p.cls}"${p.style ? ` style="${p.style}"` : ""}>${p.inner}</section>`)
    .join("");

  const images = Array.from(document.querySelectorAll("img")).map((img) =>
    img.complete ? null : new Promise((done) => { img.onload = img.onerror = done; }));
  const photos = pages.filter((p) => p.style).map((p) => new Promise((done) => {
    const url = /url\('([^']+)'\)/.exec(p.style);
    if (!url) return done();
    const img = new Image(); img.onload = img.onerror = done; img.src = url[1];
  }));
  Promise.all([...images, ...photos, document.fonts.ready]).then(() => { window.__ready = true; });
})();
</script>
</body>
</html>
