<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astral library</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="library.css" />
  </head>
  <body class="lib-root">
    <a class="lib-skip" href="#lib-main">Skip to content</a>
    <header class="lib-bar">
      <div class="lib-bar-inner">
        <p class="lib-brand">Astral</p>
        <nav class="lib-nav" aria-label="Library">
          <button type="button" data-lib-page="start">Start</button>
          <button type="button" data-lib-page="tokens">Tokens</button>
          <button type="button" data-lib-page="components">Components</button>
          <button type="button" data-lib-page="features">Features</button>
          <button type="button" data-lib-page="access">Access</button>
        </nav>
        <button type="button" class="lib-download" data-lib-pack aria-haspopup="dialog" aria-controls="lib-pack-dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 3v12m0 0-4-4m4 4 4-4M5 20h14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span data-lib-pack-label>Download</span>
        </button>
      </div>
    </header>
    <main id="lib-main" class="lib-main"></main>
    <script src="../astral-ui.js"></script>
    <script src="astral-lib.js"></script>
    <script src="library-pack.js"></script>
    <script src="library.js"></script>
  </body>
</html>
