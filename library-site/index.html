. Super admin is only on Platform admin. Admin, Manager, and Contributor sit on Customer and Supplier. Broker / TPI only gets Viewer."}, {"id": "layer-login", "name": "Login", "body": "A label, not a pick. Permanent has no contract end. Temporary only sees data between the contract dates on the system."}, {"id": "layer-see", "name": "What they see", "body": "Comes last as labels. Navbar first, then other features. The pills are not a pick. The shell still looks and behaves the same."}]}, {"id": "company", "name": "Company type", "summary": "Who the company is. Third party is how they relate to a customer.", "items": [{"id": "platform-admin", "name": "Platform admin", "body": "IMSERV staff. Not a company you add. Super admin is the access on this type. They get visibility on everything. Energy stays off. Home, Portfolio, Alerts, Queries, and Reports sit on the navbar."}, {"id": "customer", "name": "Customer", "body": "The organisation whose energy data is being managed. Access is Admin, Manager, Contributor, or Viewer. Energy can sit on the navbar. Home, Portfolio, Energy, Alerts, Queries, and Reports."}, {"id": "broker", "name": "Broker / TPI", "body": "A company you add. They act on behalf of one or more customers. They are third party on the link to a customer. Access is Viewer. Home is customers and the letter of authority, not a giant chart. Energy stays off. Home, Portfolio, Alerts, Queries, and Reports. They cannot invite, raise a query, resolve, run a report, or change Settings."}, {"id": "supplier", "name": "Supplier", "body": "An energy supplier. Access is Admin, Manager, Contributor, or Viewer. Energy stays off. Home is data health and exceptions. Home, Portfolio, Alerts, Queries, and Reports."}, {"id": "third-party", "name": "Third party", "body": "A relationship on the link to a customer, with who they can see and when it ends. Not a company type. Access on that link is Viewer. A consultancy that is not a broker can still be third party on that link."}]}, {"id": "roles", "name": "Access", "summary": "What each role can do. Super admin is not a customer access.", "columns": ["Role", "Where", "Can", "Not"], "rows": [["Super admin", "Platform admin", "Visibility on everything. Users and Settings. Group people into teams. Click a person for details.", "Sit on Customer, Broker / TPI, or Supplier."], ["Admin", "Customer, Supplier", "Do and see everything in their company. Users and Settings. Invite Admin, Manager, Contributor, or Viewer. Group people into teams.", "Super admin. Visibility across every company. Broker / TPI."], ["Manager", "Customer, Supplier", "Work in the product. Add people. Users. Invite Manager, Contributor, or Viewer. Group people into teams.", "Invite Admin. Open Settings. Broker / TPI."], ["Contributor", "Customer, Supplier", "Work in the product. Raise a query. Resolve. Run a live report.", "Add people. Open Users. Open Settings. Broker / TPI."], ["Viewer", "Customer, Broker / TPI, Supplier", "Look.", "Invite. Raise a query. Resolve. Run a report. Change Settings."]]}, {"id": "login", "name": "Login", "summary": "How long they can see the data. Not a pick in the product.", "items": [{"id": "permanent", "name": "Permanent", "body": "A login with no contract end on the data they can see."}, {"id": "temporary", "name": "Temporary", "body": "The contract on the system sets the from and to. They can only see data between those dates."}]}, {"id": "see", "name": "What they see", "summary": "Navbar first, then other features. Labels, not a pick.", "items": [{"id": "navbar", "name": "Navbar", "body": "Follows the company type. Customer can have Energy. Energy stays off for Platform admin, Broker / TPI, Supplier, Finance, Asset, and Data."}, {"id": "other", "name": "Other features", "body": "Profile and Log out sit for everyone. Settings sits for Super admin and Admin. Users sits for Super admin, Admin, and Manager."}, {"id": "hats", "name": "Discipline", "body": "Energy, Finance, Asset, and Data. Industry disciplines, not platform roles and not company types. They sit on Profile and Onboarding. Do not put them on the first row."}, {"id": "shell", "name": "The shell", "body": "Looks and behaves the same. The pills do not change the shell."}]}, {"id": "users", "name": "Users", "summary": "Invite and teams inside a company. Permission user groups stay in admin.", "items": [{"id": "who-opens", "name": "Who can open it", "body": "Super admin, Admin, and Manager. Contributor and Viewer cannot."}, {"id": "invite-role", "name": "Invite", "body": "Email and a role. Admin, Manager, Contributor, or Viewer on Customer and Supplier. Broker / TPI only gets Viewer. Manager cannot invite Admin. Super admin is only for Platform admin."}, {"id": "tree", "name": "The list", "body": "Super admin sees companies. Teams for the same company sit together. Admin and Manager see departments. Search the list. Filter by role uses Select. Download CSV."}, {"id": "teams", "name": "Add a team", "body": "Team name, company, and department. Then pick the people. Super admin, Admin, and Manager can do it."}, {"id": "person", "name": "A person", "body": "Super admin, Admin, and Manager click a person to see more details. Name, email, role, last active, expiry, and team. Last active is Now for you and Invited until they join. Expiry is how long is left. Contact still waits. Do not put Astral on this list."}]}, {"id": "limits", "name": "Do not", "summary": "Named limits. Stay on the types and roles on this list.", "items": [{"id": "no-third-type", "name": "Third party", "body": "Do not put Third party next to Customer, Supplier, and Broker / TPI as a company type."}, {"id": "no-broker-admin", "name": "Broker / TPI", "body": "Do not give Broker / TPI Admin, Manager, or Contributor. They only get Viewer."}, {"id": "no-super-on-customer", "name": "Super admin", "body": "Do not put Super admin on a Customer, Broker / TPI, or Supplier login."}, {"id": "no-hats-first", "name": "Discipline", "body": "Do not put Energy, Finance, Asset, or Data on the first row. Those are discipline, not access."}, {"id": "no-field", "name": "Field workers", "body": "They have their own system. They are not a main portal user."}, {"id": "no-wait-screens", "name": "Still waiting", "body": "Invoices, jobs, and a combined supplier portfolio still wait. Add a company still waits. Permission user groups stay in admin."}]}]}, "tokensCss": "/* Astral tokens. Put this in src/theme/tokens.css and import it once. */\n/* Drop Roobert Regular, Medium, and Semibold in src/theme/fonts. Aptos is the fallback. */\n@font-face {\n  font-family: Roobert;\n  src: url(\"./fonts/Roobert-Regular.otf\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: Roobert;\n  src: url(\"./fonts/Roobert-Medium.otf\") format(\"opentype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: Roobert;\n  src: url(\"./fonts/Roobert-SemiBold.otf\") format(\"opentype\");\n  font-weight: 600 700;\n  font-style: normal;\n  font-display: swap;\n}\n:root {\n  --color-gray-0: #FFFFFF;\n  --color-gray-50: #EFEFEF;\n  --color-gray-100: #eeeeee;\n  --color-gray-200: #DFDFDF;\n  --color-gray-300: #cbcbcb;\n  --color-gray-400: #afafaf;\n  --color-gray-500: #737373;\n  --color-gray-600: #545454;\n  --color-gray-700: #333333;\n  --color-gray-800: #1a1a1a;\n  --color-gray-900: #0d0d0d;\n  --color-gray-1000: #000000;\n  --color-brand-primary: #028178;\n  --color-brand-secondary: #000000;\n  --color-brand-accent: #02C2B7;\n  --color-brand-extra-2: #028178;\n  --color-brand-on-primary: #FFFFFF;\n  /* --color-status-success waits. Do not add a value. */\n  /* --color-status-warning waits. Do not add a value. */\n  /* --color-status-danger waits. Do not add a value. */\n  /* --color-status-info waits. Do not add a value. */\n  --space-0: 0;\n  --space-2: 2px;\n  --space-4: 4px;\n  --space-8: 8px;\n  --space-12: 12px;\n  --spac   const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i += 1) {
      let crc = i;
      for (let bit = 0; bit < 8; bit += 1) {
        crc = crc & 1 ? 0xedb88320 ^ (crc >>> 1) : crc >>> 1;
      }
      table[i] = crc >>> 0;
    }
    return table;
  })();

  const ROOT = "astral-react";
  const ASSET_PATHS = {

    "Roobert-SemiBold.otf": "src/theme/fonts/Roobert-SemiBold.otf",
    "imserv-logomark.svg": "src/assets/imserv-logomark.svg",
    "auth-texture.png": "src/assets/auth-texture.png",
  };

  function crc32(bytes) {
    let crc = ~0;
    for (let i = 0; i < bytes.length; i += 1) {
      crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
    }
    return ~crc >>> 0;
  }

  function u16(value) {
    const out = new Uint8Array(2);
    out[0] = value & 0xff;
    out[1] = (value >>> 8) & 0xff;
    return out;
  }

  function u32(value) {
    const out = new Uint8Array(4);
    out[0] = value & 0xff;
    out[1] = (value >>> 8) & 0xff;
    out[2] = (value >>> 16) & 0xff;
    out[3] = (value >>> 24) & 0xff;
    return out;
  }

  function concat(parts) {
    const size = parts.reduce((sum, part) => sum + part.length, 0);
    const out = new Uint8Array(size);
    let offset = 0;
    parts.forEach((part) => {
      out.set(part, offset);
      offset += part.length;
    });
    return out;
  }

  function utf8(text) {
    return new TextEncoder().encode(String(text || ""));
  }

  function dosStamp(date) {
    const year = Math.max(date.getFullYear(), 1980);
    const dosDate = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    const dosTime =
      (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
    return { date: dosDate, time: dosTime };
  }

  function zipStore(files) {
    const now = dosStamp(new Date());
    const locals = [];
    const centrals = [];
    let offset = 0;
    files.forEach((file) => {
      const name = utf8(file.name);
      const data = file.bytes;
      const crc = crc32(data);
      const local = concat([
        u32(0x04034b50),
        u16(20),
        u16(0x0800),
        u16(0),
        u16(now.time),
        u16(now.date),
        u32(crc),
        u32(data.length),
        u32(data.length),
        u16(name.length),
        u16(0),
        name,
        data,
      ]);
      const central = concat([
        u32(0x02014b50),
        u16(20),
        u16(20),
        u16(0x0800),
        u16(0),
        u16(now.time),
        u16(now.date),
        u32(crc),
        u32(data.length),
        u32(data.length),
        u16(name.length),
        u16(0),
        u16(0),
        u16(0),
        u16(0),
        u32(0),
        u32(offset),
        name,
      ]);
      locals.push(local);
      centrals.push(central);
      offset += local.length;
    });
    const centralDir = concat(centrals);
    const end = concat([
      u32(0x06054b50),
      u16(0),
      u16(0),
      u16(files.length),
      u16(files.length),
      u32(centralDir.length),
      u32(offset),
      u16(0),
    ]);
    return concat([...locals, centralDir, end]);

  function fromDataUri(href) {
    const comma = href.indexOf(",");
    if (comma < 0) return new Uint8Array();
    const meta = href.slice(0, comma);
    const body = href.slice(comma + 1);
    if (meta.includes(";base64")) {
      const binary = atob(body);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) out[i] = binary.charCodeAt(i);

    }

    if (!href) return new Uint8Array();
    if (href.startsWith("data:")) return fromDataUri(href);
    const response = await fetch(href);
    if (!response.ok) throw new Error("Could not read " + href);
    return new Uint8Array(await response.arrayBuffer());

      prototype: Boolean(parts.prototype),

  function textFile(name, text) {
    return { name: `${ROOT}/${name}`, bytes: utf8(text) };
  }

  function isFont(name) {
    return String(name || "").startsWith("Roobert-");
  }

  function isPrototypeAsset(name) {
    return name === "imserv-logomark.svg" || name === "auth-texture.png";
  }

  async function packFiles(data, parts) {
    const picked = normalizeParts(parts);
    if (!picked.components && !picked.tokens && !picked.prototype) {
      throw new Error("empty");
    }
    const files = [textFile("README.md", readme(data, picked)), textFile("src/index.ts", indexTs(picked))];
    if (picked.tokens) {
      files.push(textFile("src/theme/tokens.css", data.tokensCss || ""));
      files.push(textFile("src/theme/astral.ts", data.themeTs || ""));
    }
    if (picked.components) {
      files.push(textFile("src/theme/components.css", data.lookCss || ""));
      (data.components || []).forEach((item) => {
        const path = componentPath(item);
        const body = item.source ? String(item.source) : snippetModule(path, item.snippet);
        files.push(textFile(path, body));
      });
    }
    if (picked.prototype) {
      prototypeFiles().forEach((file) => files.push(textFile(file.name, file.text)));
    }
    for (const file of data.files || []) {
      const name = file.name || "";
      const wantFont = picked.tokens && isFont(name);
      const wantAsset = picked.prototype && isPrototypeAsset(name);
      if (!wantFont && !wantAsset) continue;
      const rel = ASSET_PATHS[name] || `src/assets/${name}`;
      files.push({ name: `${ROOT}/${rel}`, bytes: await bytesFromHref(file.href) });
    }
    return files.filter((file) => file.bytes && file.bytes.length);
  }

  function saveBlob(bytes, filename) {
    const blob = new Blob([bytes], { type: "application/zip" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
    window.setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function packLabel(button) {
    return button && button.querySelector("[data-lib-pack-label]");
  }

  async function download(data, button, parts) {
    const label = packLabel(button);
    const previous = label ? label.textContent : "";
    if (button) button.disabled = true;
    if (label) label.textContent = "Downloading";
    try {
      const files = await packFiles(data, parts);
      if (!files.length) throw new Error("empty");
      saveBlob(zipStore(files), "astral-react.zip");
      if (label) label.textContent = "Downloaded";
      window.setTimeout(() => {
        if (label) label.textContent = previous || "Download";
        if (button) button.disabled = false;
      }, 1200);
    } catch (error) {
      if (label) label.textContent = previous || "Download";
      if (button) button.disabled = false;
      throw error;
    }
  }

  const api = { packFiles, zipStore, download };
  if (typeof module === "object" && module.exports) module.exports = api;
  const root = typeof window !== "undefined" ? window : globalThis;
  root.AstralLibPack = api;
})();

<script>

  function esc(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")

    const done = () => {
      const old = button.textContent;
      button.textContent = "Copied";
      button.classList.add("lib-copied");
      setTimeout(() => {
        button.textContent = old;
        button.classList.remove("lib-copied");
      }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {});
    }
  }

  function tokenRows(kind) {
    return (data.tokens || []).filter((token) => token.kind === kind);
  }

  function fileButtons(kind) {
    return (data.files || [])
      .filter((file) => {
        if (kind === "font") return file.name.startsWith("Roobert");

        (file) =>
          `<button type="button" class="lib-ghost" data-download="${esc(file.id)}">${esc(
            file.name.startsWith("Roobert")

            )
            .join("")}
        </nav>
        <div class="lib-pane">
          <div>
            <h2>${esc(item.react || item.name)}</h2>
            ${
              item.file
                ? `<p class="lib-help">${esc(fileHint(item))}</p>`
                : ""
            }
            <p>${esc(item.summary)}</p>
          </div>
          <div class="ds-preview">${preview}</div>
          <p>${esc(item.usage)}</p>
          <div class="lib-code-head">
            <h3>Snippet</h3>
            <button type="button" class="lib-ghost" data-copy-snippet="${esc(item.id)}">Copy snippet</button>
          </div>
          <pre class="lib-code"><code>${esc(item.snippet)}</code></pre>
          ${
            item.source
              ? `<div class="lib-code-head">
            <h3>${esc(item.sourceName || "File")}</h3>
            <button type="button" class="lib-ghost" data-copy-source="${esc(item.id)}">Copy ${esc(
                  item.sourceName || "file"
                )}</button>
          </div>
          <pre class="lib-code"><code>${esc(item.source)}</code></pre>`
              : ""
          }
          <h3>Kinds</h3>
          ${chips(item.variants)}
          <h3>States</h3>
          ${chips(item.states)}
          <h3>Props</h3>
          <table class="lib-token-table">
            <thead><tr><th>Prop</th><th>Type</th><th>Note</th></tr></thead>
            <tbody>${props || "<tr><td colspan='3'>None yet.</td></tr>"}</tbody>
          </table>
          <h3>Tokens</h3>
          <table class="lib-token-table">
            <thead><tr><th>Name</th><th>CSS</th><th>React theme</th></tr></thead>
            <tbody>${tokenBits || "<tr><td colspan='3'>None yet.</td></tr>"}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function accessLayers() {
    return ((data.access && data.access.layers) || []).filter((layer) => layer && layer.id);
  }

  function accessPage() {
    const layers = accessLayers();
    const layer = layers.find((item) => item.id === accessLayer) || layers[0];
    if (!layer) {
      return `
        <section class="lib-lead">
          <h1>Access</h1>
          <p>Access logic is not here yet.</p>
        </section>
      `;
    }
    const items = (layer.items || [])
      .map(
        (item) => `
          <article class="lib-card">
            <h2>${esc(item.name)}</h2>
            <p>${esc(item.body)}</p>
          </article>
        `
      )
      .join("");
    const table =
      layer.columns && layer.rows
        ? `
          <table class="lib-token-table lib-access-table">
            <thead><tr>${layer.columns.map((col) => `<th>${esc(col)}</th>`).join("")}</tr></thead>
            <tbody>
              ${layer.rows
                .map(
                  (row) =>
                    `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join("")}</tr>`
                )
                .join("")}
            </tbody>
          </table>
        `
        : "";
    const grid = items ? `<div class="lib-grid lib-access-grid">${items}</div>` : "";
    return `
      <section class="lib-lead">
        <h1>Access</h1>
        <p>${esc((data.access && data.access.lead) || "")}</p>
      </section>
      <div class="lib-split">
        <nav class="lib-list" aria-label="Access">
          ${layers
            .map(
              (item) =>
                `<button type="button" data-access-layer="${esc(item.id)}" class="${
                  item.id === layer.id ? "is-on" : ""
                }">${esc(item.name)}</button>`
            )
            .join("")}
        </nav>
        <div class="lib-pane">
          <div>
            <h2>${esc(layer.name)}</h2>
            <p class="lib-help">${esc(layer.summary || "")}</p>
          </div>
          ${table}
          ${grid}
        </div>
      </div>
    `;
  }

  function render() {
    nav.querySelectorAll("button").forEach((button) => {
      button.classList.toggle("is-on", button.dataset.libPage === page);
    });
    if (page === "tokens") main.innerHTML = tokensPage();
    else if (page === "components") main.innerHTML = componentPage();
    else if (page === "access") main.innerHTML = accessPage();
    else main.innerHTML = startPage();
  }

  function readHash() {
    const raw = (location.hash || "#start").slice(1);
    if (raw === "tokens" || raw.startsWith("tokens/")) {
      page = "tokens";
      tokenKind = raw.split("/")[1] || "colour";
      if (!TOKEN_PAGES.some((item) => item.id === tokenKind)) tokenKind = "colour";
      return;
    }
    if (raw === "access" || raw.startsWith("access/")) {
      page = "access";
      accessLayer = raw.split("/")[1] || accessLayer;
      if (!accessLayers().some((item) => item.id === accessLayer)) {
        accessLayer = (accessLayers()[0] && accessLayers()[0].id) || "stack";
      }
      return;
    }
    if (raw === "components" || data.components.some((comp) => comp.id === raw)) {
      page = "components";
      if (raw !== "components") componentId = raw;
      return;
    }
    page = "start";
  }

  function writeHash() {
    if (page === "tokens") location.hash = `tokens/${tokenKind}`;
    else if (page === "components") location.hash = componentId;
    else if (page === "access") location.hash = `access/${accessLayer}`;
    else location.hash = "start";
  }

  nav.addEventListener("click", (event) => {
    const button = event.target.closest("[data-lib-page]");
    if (!button) return;
    page = button.dataset.libPage;
    writeHash();
    render();
  });

  const PACK_CHOICES = [
    { id: "components", name: "Components", hint: "Icon and the other React files" },
    { id: "tokens", name: "Tokens", hint: "Colour, space, type, and Roobert" },
    { id: "prototype", name: "Prototype", hint: "Screens and the shell" },
  ];

  let packPicked = {
    components: true,
    tokens: true,
    prototype: true,
  };
  let packBusy = false;
  let packError = "";
  let packLastFocus = null;

  function packAnyOn() {
    return PACK_CHOICES.some((item) => packPicked[item.id]);
  }

  function packCheck(on) {
    const ui = window.AstralUI;
    if (ui && ui.check) return ui.check(on);
    return `<span class="astral-check${on ? " is-on" : ""}" aria-hidden="true"></span>`;
  }

  function packModalHtml() {
    const ui = window.AstralUI;
    if (!ui || !ui.modalHead || !ui.button) return "";
    const picks = PACK_CHOICES.map((item) => {
      const on = Boolean(packPicked[item.id]);
      return `
        <button
          type="button"
          role="checkbox"
          class="${on ? "is-on" : ""}"
          aria-checked="${on ? "true" : "false"}"
          data-lib-pack-part="${esc(item.id)}"
          ${packBusy ? " disabled" : ""}
        >
          ${packCheck(on)}
          <span class="astral-pack-copy">
            <span>${esc(item.name)}</span>
            <span class="astral-muted">${esc(item.hint)}</span>
          </span>
        </button>
      `;
    }).join("");
    const go = ui.button("Download", 'data-lib-pack-go', {
      type: "submit",
      disabled: packBusy || !packAnyOn(),
    });
    const error = packError
      ? `<p class="astral-muted" data-lib-pack-error role="status">${esc(packError)}</p>`
      : "";
    return `
      <div class="astral-modal-back" data-lib-pack-back>
        <div
          id="lib-pack-dialog"
          class="astral-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="lib-pack-title"
        >
          <form data-lib-pack-form>
            ${ui.modalHead(
              "lib-pack-title",
              "Download",
              "Pick what you need for the React starter.",
              "pack"
            )}
            <div class="astral-modal-body">
              <div class="astral-pack-picks" role="group" aria-label="React starter">
                ${picks}
              </div>
            </div>
            <div class="astral-modal-foot">
              <div class="astral-actions">${go}</div>
              ${error}
            </div>
          </form>
        </div>
      </div>
    `;
  }

  function packHost() {
    return document.querySelector("[data-lib-pack-back]");
  }

  function paintPackModal() {
    const host = packHost();
    if (!host) return;
    const html = packModalHtml();
    if (!html) return;
    host.outerHTML = html.trim();
    const go = document.querySelector("[data-lib-pack-go]");
    if (packBusy && go) go.textContent = "Downloading";
  }

  function closePackModal() {
    const host = packHost();
    if (host) host.remove();
    packBusy = false;
    packError = "";
    if (packBtn) packBtn.setAttribute("aria-expanded", "false");
    if (packLastFocus && typeof packLastFocus.focus === "function") packLastFocus.focus();
    packLastFocus = null;
  }

  function openPackModal() {
    if (packHost()) return;
    const html = packModalHtml();
    if (!html) return;
    packBusy = false;
    packError = "";
    packPicked = { components: true, tokens: true, prototype: true };
    packLastFocus = document.activeElement;
    document.body.insertAdjacentHTML("beforeend", html.trim());
    if (packBtn) packBtn.setAttribute("aria-expanded", "true");
    const first = document.querySelector("[data-lib-pack-part]");
    if (first) first.focus();
  }

  async function runPackDownload() {
    const pack = window.AstralLibPack;
    if (!pack || !pack.download || packBusy || !packAnyOn()) return;
    packBusy = true;
    packError = "";
    paintPackModal();
    try {
      await pack.download(data, null, packPicked);
      closePackModal();
    } catch {
      packBusy = false;
      packError = "Could not download the starter. Try again.";
      paintPackModal();
      const retry = document.querySelector("[data-lib-pack-go]");
      if (retry) retry.focus();
    }
  }

  const packBtn = document.querySelector("[data-lib-pack]");
  if (packBtn) {
    packBtn.setAttribute("aria-haspopup", "dialog");
    packBtn.setAttribute("aria-controls", "lib-pack-dialog");
    packBtn.setAttribute("aria-expanded", "false");
    packBtn.addEventListener("click", () => {
      openPackModal();
    });
  }

  document.addEventListener("click", (event) => {
    const host = packHost();
    if (!host) return;
    const close = event.target.closest('[data-proto-modal-close="pack"]');
    if (close || event.target === host) {
      event.preventDefault();
      closePackModal();
      return;
    }
    const part = event.target.closest("[data-lib-pack-part]");
    if (part && host.contains(part)) {
      event.preventDefault();
      if (packBusy) return;
      const id = part.dataset.libPackPart;
      if (!Object.prototype.hasOwnProperty.call(packPicked, id)) return;
      packPicked[id] = !packPicked[id];
      paintPackModal();
      const again = document.querySelector(`[data-lib-pack-part="${id}"]`);
      if (again) again.focus();
    }
  });

  document.addEventListener("submit", (event) => {
    const form = event.target.closest("[data-lib-pack-form]");
    if (!form) return;
    event.preventDefault();
    runPackDownload();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || !packHost()) return;
    event.preventDefault();
    closePackModal();
  });

  main.addEventListener("click", (event) => {
    const sw = event.target.closest(".astral-switch");
    if (sw) {
      const on = !sw.classList.contains("is-on");
      sw.classList.toggle("is-on", on);
      sw.setAttribute("aria-checked", on ? "true" : "false");
      return;
    }
    const kind = event.target.closest("[data-token-kind]");
    if (kind) {
      tokenKind = kind.dataset.tokenKind;
      writeHash();
      render();
      return;
    }
    const layerBtn = event.target.closest("[data-access-layer]");
    if (layerBtn) {
      accessLayer = layerBtn.dataset.accessLayer;
      writeHash();
      render();
      return;
    }
    const comp = event.target.closest("[data-comp]");
    if (comp) {
      componentId = comp.dataset.comp;
      writeHash();
      render();
      return;
    }
    const copyKind = event.target.closest("[data-copy]");
    if (copyKind) {
      const which = copyKind.dataset.copy;
      const text =
        which === "theme"
          ? data.themeTs
          : which === "start"
            ? data.reactStart
            : which === "look"
              ? data.lookCss
              : data.tokensCss;
      copy(text, copyKind);
      return;
    }
    const copySnippet = event.target.closest("[data-copy-snippet]");
    if (copySnippet) {
      const item = data.components.find((comp) => comp.id === copySnippet.dataset.copySnippet);
      if (item) copy(item.snippet, copySnippet);
      return;
    }
    const copySource = event.target.closest("[data-copy-source]");
    if (copySource) {
      const item = data.components.find((comp) => comp.id === copySource.dataset.copySource);
      if (item && item.source) copy(item.source, copySource);
      return;
    }
    const download = event.target.closest("[data-download]");
    if (download) {
      const file = (data.files || []).find((item) => item.id === download.dataset.download);
      if (file && file.href) {
        const link = document.createElement("a");
        link.href = file.href;
        link.download = file.name;
        link.click();
      }
      return;
    }
    const copyText = event.target.closest("[data-copy-text]");
    if (copyText) copy(copyText.dataset.copyText, copyText);
  });

  window.addEventListener("hashchange", () => {
    readHash();
    render();
  });

  readHash();
  render();
})();

</script>
  </body>
</html>
